<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161b1f">
<meta name="description" content="NL Builder — design your house plan in 2D and 3D, in Bangla or English.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<title>NL Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* NL Builder — a drafting instrument: dark graphite chrome, blueprint canvas,
   signal-orange for the thing you are holding, cyan for every measurement. */
:root{
  --bg:#0f1316; --chrome:#161b1f; --chrome2:#1d242a; --panel:#131a1e;
  --line:#2a343b; --line2:#39454e;
  --ink:#e9efec; --ink2:#9aa8a2; --ink3:#6b7a74;
  --canvas:#0c1013; --grid:#1a242b; --gridMaj:#27353e; --paper:#0c1013;
  --accent:#ff7a18; --accent2:#ffa45c;
  --meas:#35c8d8; --land:#8bd450; --wall:#cfd8d4; --wallFill:#404c53;
  --danger:#ff5566; --ok:#5ad18a; --onAccent:#140c05;
  --fontUI:'IBM Plex Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fontBN:'Hind Siliguri','IBM Plex Sans',system-ui,sans-serif;
  --fontNum:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rs:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eef1ed; --chrome:#f6f8f4; --chrome2:#e7ebe6; --panel:#fbfcfa;
    --line:#d4dbd4; --line2:#bcc6bd;
    --ink:#151a17; --ink2:#5b665f; --ink3:#8a948d;
    --canvas:#fbfcf8; --grid:#e2e8e1; --gridMaj:#cdd6cc; --paper:#fbfcf8;
    --accent:#d1540a; --accent2:#a8420a;
    --meas:#0d7f8c; --land:#4e8b22; --wall:#2a332e; --wallFill:#c3ccc5;
    --danger:#c62d3e; --ok:#1d7a4a; --onAccent:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1ed; --chrome:#f6f8f4; --chrome2:#e7ebe6; --panel:#fbfcfa;
  --line:#d4dbd4; --line2:#bcc6bd;
  --ink:#151a17; --ink2:#5b665f; --ink3:#8a948d;
  --canvas:#fbfcf8; --grid:#e2e8e1; --gridMaj:#cdd6cc; --paper:#fbfcf8;
  --accent:#d1540a; --accent2:#a8420a;
  --meas:#0d7f8c; --land:#4e8b22; --wall:#2a332e; --wallFill:#c3ccc5;
  --danger:#c62d3e; --ok:#1d7a4a; --onAccent:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--fontUI);
  font-size:14px; overflow:hidden; -webkit-tap-highlight-color:transparent;
}
body[data-lang="bn"]{font-family:var(--fontBN)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--fontNum);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;}
#top{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
#mid{display:grid;grid-template-columns:auto 1fr auto;min-height:0;position:relative;overflow:hidden}
#stage{position:relative;min-width:0;background:var(--canvas);overflow:hidden}
#c2d,#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c3d{display:none}
body[data-view="3d"] #c2d{display:none}
body[data-view="3d"] #c3d{display:block}
#bottom{
  display:flex;align-items:center;gap:14px;padding:6px 12px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--chrome);border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2);overflow-x:auto;white-space:nowrap
}
#bottom .sep{width:1px;height:16px;background:var(--line);flex:none}

/* ---------- tool rail ---------- */
#rail{
  width:60px;background:var(--chrome);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto
}
.tool{
  width:48px;height:46px;border:1px solid transparent;border-radius:var(--rs);
  background:transparent;cursor:pointer;display:grid;place-items:center;gap:2px;
  grid-template-rows:20px auto;color:var(--ink2);transition:background .12s,color .12s
}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool i{font-style:normal;font-size:9px;letter-spacing:.02em;line-height:1}
.tool:hover{background:var(--chrome2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tool:focus-visible{outline:2px solid var(--meas);outline-offset:1px}
.railgap{height:10px;border-top:1px solid var(--line);margin:4px 2px}

/* ---------- side panel ---------- */
#side{
  width:290px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
#sideTabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#sideTabs button{
  flex:1;padding:10px 4px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink3);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em
}
#sideTabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#sideBody{flex:1;overflow-y:auto;padding:12px;min-height:0}
.sec{margin-bottom:16px}
.sec>h3{
  margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3)
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row.one{grid-template-columns:1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:10px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.fld input,.fld select{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:7px 8px;font-family:var(--fontNum);font-size:13px;min-width:0;width:100%
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld.txt input{font-family:var(--fontUI)}
.btn{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap
}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}
.btn.dgr{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{padding:6px 9px;font-size:11.5px}
.btn:focus-visible{outline:2px solid var(--meas);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--chrome2);border-color:var(--accent);color:var(--accent)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* catalogue */
.catsearch{width:100%;background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin-bottom:10px}
.catsearch:focus{outline:none;border-color:var(--accent)}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.citem{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:7px 6px 6px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center
}
.citem:hover{border-color:var(--accent)}
.citem[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--chrome2))}
.citem svg{width:100%;height:30px}
.citem b{font-size:10.5px;font-weight:600;line-height:1.15}
.citem em{font-style:normal;font-size:9px;color:var(--ink3);font-family:var(--fontNum)}

/* list */
.lst{display:flex;flex-direction:column;gap:4px}
.lrow{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--rs);
  background:var(--chrome2);border:1px solid var(--line);cursor:pointer;font-size:12.5px
}
.lrow:hover{border-color:var(--line2)}
.lrow[aria-selected="true"]{border-color:var(--accent)}
.lrow .sw{width:9px;height:9px;border-radius:2px;background:var(--ink3);flex:none}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .va{font-family:var(--fontNum);font-size:11px;color:var(--ink3)}

/* stat strip */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 9px}
.stat b{display:block;font-family:var(--fontNum);font-size:16px;font-weight:600;letter-spacing:-.01em}
.stat span{display:block;font-size:10px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.stat.wide{grid-column:1/-1}

/* segmented */
.seg{display:inline-flex;background:var(--chrome2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--ink3)
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.seg.ghost button[aria-pressed="true"]{background:var(--chrome);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button:focus-visible{outline:2px solid var(--meas);outline-offset:1px}

/* floating hint + modal */
#hint{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(10px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--chrome) 92%,transparent);
  border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12.5px;
  color:var(--ink2);pointer-events:none;backdrop-filter:blur(8px);max-width:90%;text-align:center
}
#modal{position:fixed;inset:0;background:rgba(4,7,9,.72);display:grid;place-items:center;padding:18px;z-index:50}
#modal[hidden]{display:none}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto
}
.card h2{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 14px;color:var(--ink2);font-size:13px;line-height:1.5}
.card textarea{
  width:100%;height:170px;background:var(--chrome2);border:1px solid var(--line);
  border-radius:var(--rs);padding:10px;font-family:var(--fontNum);font-size:11.5px;resize:vertical
}
.card textarea:focus{outline:none;border-color:var(--accent)}
.help{font-size:12.5px;line-height:1.65;color:var(--ink2)}
.help h4{margin:14px 0 5px;font-size:12.5px;color:var(--ink)}
.help ul{margin:0;padding-left:18px}
.help li{margin-bottom:4px}
.kbd{font-family:var(--fontNum);font-size:11px;background:var(--chrome2);border:1px solid var(--line);
     border-radius:4px;padding:1px 5px}

/* survey */
.note{margin:0 0 9px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.svshape{width:100%;height:auto;background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);margin-top:4px}
.svrow{display:grid;grid-template-columns:10px 1fr 62px 24px 94px;align-items:center;gap:7px;
  padding:6px 8px;border-radius:var(--rs);background:var(--chrome2);border:1px solid var(--line)}
.svrow .nm{font-size:12.5px;font-weight:600;font-family:var(--fontNum);white-space:nowrap}
.svrow input{background:var(--chrome);border:1px solid var(--line);border-radius:5px;
  padding:5px 6px;font-family:var(--fontNum);font-size:12px;width:100%;min-width:0}
.svrow input:focus{outline:none;border-color:var(--accent)}
.svthumb{width:34px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer}
.svthumb.empty{background:var(--chrome);display:block}
.svcam{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  padding:7px 6px;font-size:11.5px;font-weight:700;line-height:1;letter-spacing:.02em}
.svcam svg{width:15px;height:15px;flex:none}
@media (pointer:coarse){ .svcam{padding:9px 6px;font-size:12.5px} .svcam svg{width:17px;height:17px} }
#camWrap{position:relative;width:100%;aspect-ratio:4/3;background:#07090b;border-radius:var(--rs);
  overflow:hidden;border:1px solid var(--line)}
#camVid,#camShot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#camOv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#camTag{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(10,14,17,.76);
  color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;pointer-events:none}

/* tablet: roomier targets, wider panel (Galaxy Tab S11 Ultra and friends) */
@media (min-width:1100px){
  #side{width:340px}
  #rail{width:70px}
  .tool{width:58px;height:54px}
  .tool svg{width:22px;height:22px}
  .tool i{font-size:9.5px}
}
@media (pointer:coarse){
  .fld input,.fld select{padding:10px 10px;font-size:15px}
  .btn{padding:11px 14px;font-size:13.5px}
  .btn.sm{padding:9px 11px;font-size:12.5px}
  .seg button{padding:10px 16px;font-size:13px}
  #sideTabs button{padding:13px 4px;font-size:12.5px}
  .lrow{padding:11px 10px;font-size:13.5px}
  .svrow{grid-template-columns:10px 1fr 70px 26px 108px;padding:9px 9px}
  .svrow input{padding:8px 7px;font-size:13px}
  .citem b{font-size:11.5px}
}
/* mobile */
#sideToggle,#railToggle{display:none}
@media (max-width:900px){
  #mid{grid-template-columns:auto 1fr}
  #side{
    position:absolute;right:0;top:0;bottom:0;z-index:20;width:min(300px,86vw);
    box-shadow:-14px 0 36px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .22s ease
  }
  body[data-side="open"] #side{transform:none}
  #sideToggle{display:inline-flex}
  #rail{width:52px}
  .tool{width:40px;height:42px}
}
@media (max-width:620px){
  .brand span{display:none}
  #top{gap:7px;padding:7px 9px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
  .seg button{padding:6px 10px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- AR ruler overlay ---------- */
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:9998;background:transparent}
#arOverlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;font-family:var(--fontUI);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body[data-lang="bn"] #arOverlay{font-family:var(--fontBN)}
#arTop{padding:16px}
#arTip{pointer-events:none;display:inline-block;max-width:560px;background:rgba(8,10,12,.74);color:#fff;
  padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.45;backdrop-filter:blur(6px)}
#arBot{pointer-events:auto;background:rgba(9,11,13,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.14);
  padding:16px 16px 20px;display:flex;flex-direction:column;gap:13px;align-items:center}
#arRead{text-align:center;color:#fff}
#arBig{display:block;font-family:var(--fontNum);font-size:46px;font-weight:700;letter-spacing:-.5px;line-height:1}
#arSub{display:block;margin-top:6px;font-size:13px;opacity:.76}
#arBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arb{pointer-events:auto;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;
  padding:13px 18px;border-radius:12px;font:600 14px/1 var(--fontUI);cursor:pointer;backdrop-filter:blur(6px)}
body[data-lang="bn"] .arb{font-family:var(--fontBN)}
.arb:active{transform:translateY(1px)}
.arb.big{background:var(--accent);border-color:var(--accent);color:var(--onAccent);padding:15px 40px;font-size:16px}
.arb.ok{background:rgba(255,255,255,.92);color:#101316;border-color:transparent}
.btn.wide{width:100%;justify-content:center}
#arBanner{margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--chrome2)}
#arBanner .note{margin:8px 0 0}

.prow{display:grid;grid-template-columns:10px 1fr 34px;align-items:center;gap:9px;
  padding:9px 10px;border:1px solid var(--line);border-radius:var(--rs);background:var(--chrome);
  margin-bottom:6px;cursor:pointer}
.prow:hover{border-color:var(--line2)}
.prow.on{border-color:var(--accent);background:var(--chrome2)}
.prow .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .pn b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn i{font-style:normal;font-size:11px;color:var(--ink2);font-family:var(--fontNum)}
.prow .prdel{padding:5px 0;width:100%;color:var(--ink2);font-size:13px;line-height:1}
.prow .prdel:hover{color:var(--danger);border-color:var(--danger)}
@media (pointer:coarse){ .prow{padding:12px 11px} .prow .prdel{padding:9px 0} }

/* ---------- editing helpers ---------- */
#shapeBar{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;
  background:var(--chrome);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#shapeBar #sb_n{font:600 12.5px/1 var(--fontNum);color:var(--ink2);padding:0 6px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw2{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);cursor:pointer;padding:0;position:relative}
.sw2[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw2.pick{background:conic-gradient(#f55,#fd5,#5d5,#5df,#55f,#f5f,#f55);overflow:hidden}
.sw2.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rotrow{margin-top:8px;display:flex;flex-wrap:nowrap;gap:5px}
.rotrow .btn{font-family:var(--fontNum);flex:1 1 0;min-width:0;padding-left:2px;padding-right:2px;justify-content:center;white-space:nowrap}
.selsec{border-left:3px solid var(--accent);padding-left:12px}
@media (pointer:coarse){ .sw2{width:36px;height:36px} #shapeBar .btn{padding:11px 16px} }
</style>

<div id="app">
  <header id="top">
    <div class="brand"><b>NL BUILDER</b><span data-i="tagline">Home design studio</span></div>
    <div class="seg" role="group" aria-label="View">
      <button id="v2d" aria-pressed="true" data-i="v2d">2D Plan</button>
      <button id="v3d" aria-pressed="false" data-i="v3d">3D View</button>
    </div>
    <div class="seg ghost" role="group" aria-label="Units">
      <button id="uft" aria-pressed="true">ft</button>
      <button id="um" aria-pressed="false">m</button>
    </div>
    <div style="flex:1"></div>
    <div class="seg ghost" role="group" aria-label="Language">
      <button id="len" aria-pressed="true">EN</button>
      <button id="lbn" aria-pressed="false">বাংলা</button>
    </div>
    <button class="btn sm" id="btnTheme" title="Theme">◐</button>
    <button class="btn sm" id="btnHelp" data-i="help">Help</button>
    <button class="btn sm" id="sideToggle" data-i="panel">Panel</button>
  </header>

  <div id="mid">
    <nav id="rail" aria-label="Tools"></nav>
    <div id="stage">
      <canvas id="c2d"></canvas>
      <canvas id="c3d"></canvas>
      <div id="hint"></div>

/* ===== p_model.js ===== */
/* ===================== units ===================== */
const FT_PER_M = 3.280839895;
const SQFT = { katha:720, shotok:435.6, bigha:14400, sqft:1 };
let UNIT = 'ft';                                        /* display unit      */
const toU   = ft => UNIT === 'ft' ? ft : ft / FT_PER_M; /* feet -> display   */
const fromU = v  => UNIT === 'ft' ? v  : v * FT_PER_M;  /* display -> feet   */
const uname = () => UNIT === 'ft' ? 'ft' : 'm';
const fmt = (ft, dp) => toU(ft).toFixed(dp === undefined ? 2 : dp);
const fmtU = (ft, dp) => fmt(ft, dp) + ' ' + uname();
function fmtLen(ft){                                    /* 12' 6" or 3.81 m  */
  if (UNIT === 'm') return toU(ft).toFixed(2) + ' m';
  const whole = Math.floor(Math.abs(ft));
  const inch = Math.round((Math.abs(ft) - whole) * 12);
  const w2 = inch === 12 ? whole + 1 : whole, i2 = inch === 12 ? 0 : inch;
  return (ft < 0 ? '-' : '') + w2 + "'" + (i2 ? ' ' + i2 + '"' : '');
}

  if (!P.survey) P.survey = { n:4, sides:[], diags:[] };
  const s = P.survey, n = clamp(s.n || 4, 3, 8);
  s.n = n;
  while (s.sides.length < n) s.sides.push(blankMeasure());
  s.sides.length = n;
  const nd = Math.max(0, n - 3);                       /* fan diagonals from corner A */
  while (s.diags.length < nd) s.diags.push(blankMeasure());
  s.diags.length = nd;
  return s;
}
const CORNER = i => String.fromCharCode(65 + i);       /* 0 -> A */
let P = blankProject();
let SEL = null;                 /* {type:'room'|'wall'|'item'|'open'|'text', id} */
const F  = () => P.floors[P.active];

              straight:true, magnet:true, angSnap:false };

let UNDO = [], REDO = [];
const snap0 = () => JSON.stringify({P,uid});
function push(){ UNDO.push(snap0()); if (UNDO.length > 80) UNDO.shift(); REDO.length = 0; save(); }
function restore(s){ const o = JSON.parse(s); P = o.P; uid = o.uid; SEL = null; }
function undo(){ if (!UNDO.length) return; REDO.push(snap0()); restore(UNDO.pop()); afterChange(); }

/* ---- persistence: a library of projects, each under its own key ---- */
const KEY  = 'nlbuilder.v1';          /* legacy single-project key */
const LKEY = 'nlbuilder.lib';         /* index of all projects */
const pKey = id => 'nlbuilder.p.' + id;
let PID = null, saveTimer = null;

function newPid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function libRead(){
  try { const o = JSON.parse(localStorage.getItem(LKEY)); if (o && Array.isArray(o.list)) return o; } catch(e){}
  return { cur:null, list:[] };
}
function libWrite(l){ try { localStorage.setItem(LKEY, JSON.stringify(l)); } catch(e){} }
function libList(){ return libRead().list.slice().sort((a,b) => (b.ts||0) - (a.ts||0)); }

function saveNow(){
  if (!PID) PID = newPid();
  try { localStorage.setItem(pKey(PID), JSON.stringify({ P, uid })); } catch(e){ return; }
  const l = libRead();
  let e0 = l.list.find(x => x.id === PID);
  if (!e0){ e0 = { id:PID }; l.list.push(e0); }
  e0.name = (P.name || '').trim() || 'Untitled';
  e0.ts   = Date.now();
  e0.area = plotArea();
  e0.floors = P.floors.length;
  l.cur = PID;
  libWrite(l);
  flashSaved();
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 450); }

function fixProject(o){
  if (!o || !o.floors) return false;
  o.floors.forEach(f => { f.texts = f.texts || []; f.openings = f.openings || []; f.walls = f.walls || []; });
  if (!o.plot.hasOwnProperty('poly')) o.plot.poly = null;
  return true;
}
function openProject(id){
  let o = null;
  try { o = JSON.parse(localStorage.getItem(pKey(id))); } catch(e){}
  if (!o || !fixProject(o.P)) return false;
  clearTimeout(saveTimer);
  P = o.P; uid = o.uid || 1; PID = id;
  UNDO.length = 0; REDO.length = 0; SEL = null;
  ensureSurvey();
  const l = libRead(); l.cur = id; libWrite(l);
  return true;
}
function deleteProject(id){
  try { localStorage.removeItem(pKey(id)); } catch(e){}
  const l = libRead(); l.list = l.list.filter(x => x.id !== id);
  if (l.cur === id) l.cur = null;
  libWrite(l);
  if (PID === id){
    PID = null;
    const next = libList()[0];
    if (next && openProject(next.id)) return;
    P = blankProject(); uid = 1; UNDO.length = 0; REDO.length = 0; SEL = null;
    saveNow();
  }
}
function newProject(blank){
  clearTimeout(saveTimer);
  if (PID) saveNow();                       /* keep what is open */
  P = blank || blankProject(); uid = 1; PID = newPid();
  UNDO.length = 0; REDO.length = 0; SEL = null;
  ensureSurvey(); saveNow();
}
function copyProject(){
  clearTimeout(saveTimer);
  if (PID) saveNow();
  const o = JSON.parse(JSON.stringify(P));
  o.name = (P.name || 'Untitled') + ' (copy)';
  P = o; PID = newPid(); UNDO.length = 0; REDO.length = 0; SEL = null;
  saveNow();
}

function load(){
  const l = libRead();
  if (l.cur && openProject(l.cur)) return true;
  const first = libList()[0];
  if (first && openProject(first.id)) return true;
  /* one-time migration from the old single-project key */
  try {
    const s = localStorage.getItem(KEY);
    if (s){
      const o = JSON.parse(s);
      if (o && fixProject(o.P)){
        P = o.P; uid = o.uid || 1; PID = newPid();
        ensureSurvey(); saveNow();
        try { localStorage.removeItem(KEY); } catch(e){}
        return true;
      }
    }
  } catch(e){}
  return false;
}

/* ===================== geometry helpers ===================== */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const snapV = v => OPT.snap ? Math.round(v / OPT.snap) * OPT.snap : v;
const d2 = (ax,ay,bx,by) => (ax-bx)**2 + (ay-by)**2;

/* every wall segment on a floor, with a stable key */
function segments(fl){
  const out = [];
  (fl.rooms||[]).forEach(r => {
    const t = r.t ?? 0.4, c = roomPts(r), n = c.length;
    const names = n === 4 ? ['n','e','s','w'] : c.map((_,i) => 'p'+i);
    for (let i=0;i<n;i++){
      const a = c[i], b = c[(i+1)%n];
      out.push({ key:'r:'+r.id+':'+names[i], x1:a[0], y1:a[1], x2:b[0], y2:b[1], t, room:r.id, side:names[i], h:r.h });
    }
  });
  (fl.walls||[]).forEach(w => out.push({ key:'w:'+w.id, x1:w.x1, y1:w.y1, x2:w.x2, y2:w.y2, t:w.t ?? 0.4, free:w.id, h:w.h }));
  return out;
}
/* A room is a rectangle (w x d, rotated) or, when it has pts, any shape.
   pts are kept relative to the room centre so moving / rotating still works.
   Corner order for a 4-sided room is NW, NE, SE, SW  ->  sides n, e, s, w. */
function roomLocal(r){
  if (r.pts && r.pts.length >= 3) return r.pts;
  const hw = r.w/2, hd = r.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]];
}
function roomPts(r){ return roomLocal(r).map(([x,y]) => rot2(x,y,r.rot||0,r.x,r.y)); }
function pipLocal(x, y, p){
  let c = false;
  for (let i=0,j=p.length-1;i<p.length;j=i++){
    if (((p[i][1]>y)!==(p[j][1]>y)) && (x < (p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1]) + p[i][0])) c = !c;
  }
  return c;
}
function inRoom(r, X, Y){
  const a = -(r.rot||0)*Math.PI/180, dx = X-r.x, dy = Y-r.y;
  const lx = dx*Math.cos(a) - dy*Math.sin(a), ly = dx*Math.sin(a) + dy*Math.cos(a);
  if (!r.pts) return Math.abs(lx) <= r.w/2 && Math.abs(ly) <= r.d/2;
  return pipLocal(lx, ly, r.pts);
}
function setRoomSize(r, nw, nd){
  if (r.pts){
    const kx = nw/(r.w||1), ky = nd/(r.d||1);
    r.pts = r.pts.map(([x,y]) => [x*kx, y*ky]);
  }
  r.w = nw; r.d = nd;
}
/* build a shaped room from world-space corners */
function shapeRoom(name, world, t){
  const xs = world.map(p => p[0]), ys = world.map(p => p[1]);
  const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
  const cx = (x1+x2)/2, cy = (y1+y2)/2;
  return { id:nid(), name, x:cx, y:cy, w:x2-x1, d:y2-y1, rot:0, t: t ?? .4,
           pts: world.map(([x,y]) => [x-cx, y-cy]) };
}
function rot2(x,y,deg,cx,cy){
  const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
  return [cx + x*c - y*s, cy + x*s + y*c];
}
function segLen(s){ return Math.hypot(s.x2-s.x1, s.y2-s.y1); }
function pointOnSeg(s, px, py){            /* -> {t, dist} */
  const dx = s.x2-s.x1, dy = s.y2-s.y1, L2 = dx*dx + dy*dy || 1;
  let tt = ((px-s.x1)*dx + (py-s.y1)*dy) / L2;
  tt = clamp(tt, 0, 1);
  const qx = s.x1 + dx*tt, qy = s.y1 + dy*tt;
  return { t:tt, dist:Math.hypot(px-qx, py-qy), x:qx, y:qy };
}
function roomArea(r){ return r.pts ? polyArea(r.pts) : r.w * r.d; }
/* shoelace */
function polyArea(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[(i+1) % pts.length];
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a) / 2;
}
function polyBounds(pts){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x1:Math.min(...xs), x2:Math.max(...xs), y1:Math.min(...ys), y2:Math.max(...ys) };
}
/* two circle intersections, or null when they cannot meet */
function circleInt(ax,ay,ra, bx,by,rb){
  const dx = bx-ax, dy = by-ay, d = Math.hypot(dx,dy);
  if (d < 1e-9 || d > ra + rb + 1e-6 || d < Math.abs(ra - rb) - 1e-6) return null;
  const a = (ra*ra - rb*rb + d*d) / (2*d);
  const h2 = ra*ra - a*a, h = Math.sqrt(Math.max(0, h2));
  const mx = ax + a*dx/d, my = ay + a*dy/d;
  return [[mx + h*dy/d, my - h*dx/d], [mx - h*dy/d, my + h*dx/d]];
}
/* Build the real land shape from measured sides and the diagonals taken
   from corner A — the way a chain survey is worked out on paper.       */
function solvePolygon(sides, diags){
  const n = sides.length;
  if (n < 3) return null;
  if (sides.some(v => !(v > 0))) return null;
  const pts = [[0,0], [sides[0], 0]];
  for (let i = 2; i < n; i++){
    const rB = sides[i-1];
    const rA = (i <= n-2) ? diags[i-2] : sides[n-1];
    if (!(rA > 0) || !(rB > 0)) return null;
    const hit = circleInt(0, 0, rA, pts[i-1][0], pts[i-1][1], rB);
    if (!hit) return null;
    /* keep turning the same way: pick the point on the far side of the
       line through the two previous corners */
    const [px,py] = pts[i-1], [qx,qy] = pts[i-2];
    const cross = p => (px-qx)*(p[1]-qy) - (py-qy)*(p[0]-qx);
    pts.push(cross(hit[0]) >= cross(hit[1]) ? hit[0] : hit[1]);
  }
  /* centre it on the origin */
  const b = polyBounds(pts), cx = (b.x1+b.x2)/2, cy = (b.y1+b.y2)/2;
  return pts.map(([x,y]) => [x - cx, y - cy]);
}
function plotPoly(){
  if (P.plot.poly && P.plot.poly.length >= 3) return P.plot.poly;
  const hw = P.plot.w/2, hd = P.plot.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]];
}
function builtArea(fl){ return (fl.rooms||[]).reduce((a,r) => a + roomArea(r), 0); }
function plotArea(){ return (P.plot.poly && P.plot.poly.length >= 3) ? polyArea(P.plot.poly) : P.plot.w * P.plot.d; }
function inPlot(x,y){
  const pts = plotPoly(); let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++){
    const [xi,yi] = pts[i], [xj,yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi) + xi)) inside = !inside;
  }
  return inside;
}

/* ===================== 2D plan ===================== */
const c2 = document.getElementById('c2d');
let g = c2.getContext('2d');
const cam = { x:0, y:0, z:9 };            /* world centre + pixels per foot */
let VW = 0, VH = 0, DPR = 1;
let TOOL = 'select', PICK = 'bed_d';
let drag = null, hover = null, measureLine = null, ghost = null, EXPORTING = false, curOp = null;

function resize2d(){
  const r = c2.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = r.width; VH = r.height;
  c2.width = Math.max(1, Math.round(VW*DPR)); c2.height = Math.max(1, Math.round(VH*DPR));
  g.setTransform(DPR,0,0,DPR,0,0);
}
const sx = wx => VW/2 + (wx - cam.x) * cam.z;
const sy = wy => VH/2 + (wy - cam.y) * cam.z;
const wx = px => cam.x + (px - VW/2) / cam.z;
const wy = py => cam.y + (py - VH/2) / cam.z;
function fitView(){
  const pad = 52, b = polyBounds(plotPoly());
  const w = (b.x2-b.x1) + 18, d = (b.y2-b.y1) + 18;
  cam.z = clamp(Math.min((VW-pad*2)/w, (VH-pad*2)/d), 1.2, 160);
  cam.x = (b.x1+b.x2)/2; cam.y = (b.y1+b.y2)/2;
  draw();
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- grid + scale ---------- */
function drawGrid(){
  const minor = UNIT === 'ft' ? 1 : fromU(1), major = minor*5;
  const x0 = wx(0), x1 = wx(VW), y0 = wy(0), y1 = wy(VH);
  if (OPT.grid && minor*cam.z > 4){
    g.lineWidth = 1; g.strokeStyle = css('--grid'); g.beginPath();
    for (let x = Math.ceil(x0/minor)*minor; x < x1; x += minor){ const p = Math.round(sx(x))+.5; g.moveTo(p,0); g.lineTo(p,VH); }
    for (let y = Math.ceil(y0/minor)*minor; y < y1; y += minor){ const p = Math.round(sy(y))+.5; g.moveTo(0,p); g.lineTo(VW,p); }
    g.stroke();
  }
  if (OPT.grid && major*cam.z > 10){
    g.lineWidth = 1; g.strokeStyle = css('--gridMaj'); g.beginPath();
    for (let x = Math.ceil(x0/major)*major; x < x1; x += major){ const p = Math.round(sx(x))+.5; g.moveTo(p,0); g.lineTo(p,VH); }
    for (let y = Math.ceil(y0/major)*major; y < y1; y += major){ const p = Math.round(sy(y))+.5; g.moveTo(0,p); g.lineTo(VW,p); }
    g.stroke();
  }
}
function drawScaleBar(){
  const want = 120;                                  /* aim ~120 px */
  const steps = UNIT === 'ft' ? [1,2,5,10,20,50,100] : [0.5,1,2,5,10,20,50].map(fromU);
  let unitLen = steps[steps.length-1];
  for (const s of steps) if (s*cam.z >= want*0.55){ unitLen = s; break; }
  const px = unitLen*cam.z, x = 16, y = VH-20;
  g.strokeStyle = css('--ink2'); g.fillStyle = css('--ink2'); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(x,y-5); g.lineTo(x,y); g.lineTo(x+px,y); g.lineTo(x+px,y-5); g.stroke();
  g.beginPath(); g.moveTo(x,y-3); g.lineTo(x+px/2,y-3); g.lineTo(x+px/2,y); g.lineTo(x,y); g.closePath(); g.fill();
  g.font = '600 11px ' + css('--fontNum');
  g.textAlign = 'left'; g.textBaseline = 'bottom';
  g.fillText(fmt(unitLen,0) + ' ' + uname(), x, y-8);
}

/* ---------- land ---------- */
function drawPlot(){
  const pts = plotPoly(), b = polyBounds(pts);
  g.save();
  g.beginPath();
  g.moveTo(sx(pts[0][0]), sy(pts[0][1]));
  for (let i = 1; i < pts.length; i++) g.lineTo(sx(pts[i][0]), sy(pts[i][1]));
  g.closePath();
  g.fillStyle = css('--canvas'); g.fill();
  g.globalAlpha = .07; g.fillStyle = css('--land'); g.fill(); g.globalAlpha = 1;
  g.strokeStyle = css('--land'); g.lineWidth = 2.5; g.stroke();
  /* corner pegs, the way pillars mark a plot on the ground */
  pts.forEach(([x,y], i) => {
    g.beginPath(); g.arc(sx(x), sy(y), 4.5, 0, 7);
    g.fillStyle = css('--land'); g.fill();
    if (cam.z > 3){
      g.font = '700 10px ' + css('--fontNum');
      g.fillStyle = css('--land'); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(CORNER(i), sx(x) + 11, sy(y) - 10);
    }
  });
  /* road strip along the chosen side */
  const R = P.plot.road, rw = 13*cam.z;
  const X = sx(b.x1), Y = sy(b.y1), W = (b.x2-b.x1)*cam.z, D = (b.y2-b.y1)*cam.z;
  g.fillStyle = css('--line'); g.globalAlpha = .5;
  if (R === 'north') g.fillRect(X, Y-rw-6, W, rw);
  if (R === 'south') g.fillRect(X, Y+D+6, W, rw);
  if (R === 'west')  g.fillRect(X-rw-6, Y, rw, D);
  if (R === 'east')  g.fillRect(X+W+6, Y, rw, D);
  g.globalAlpha = 1;
  g.fillStyle = css('--ink3'); g.font = '600 11px ' + css('--fontUI');
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const rl = t('roadSide').toUpperCase();
  if (R === 'north') g.fillText(rl, X+W/2, Y-rw/2-6);
  if (R === 'south') g.fillText(rl, X+W/2, Y+D+rw/2+6);
  if (R === 'west'){ g.save(); g.translate(X-rw/2-6, Y+D/2); g.rotate(-Math.PI/2); g.fillText(rl,0,0); g.restore(); }
  if (R === 'east'){ g.save(); g.translate(X+W+rw/2+6, Y+D/2); g.rotate(Math.PI/2); g.fillText(rl,0,0); g.restore(); }
  g.restore();
  /* one dimension per boundary side */
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], c = pts[(i+1) % pts.length];
    dimLine(a[0],a[1], c[0],c[1], -22, css('--land'));
  }
}
/* dimension line offset perpendicular by `off` screen px */
function dimLine(x1,y1,x2,y2,off,col){
  const ax = sx(x1), ay = sy(y1), bx = sx(x2), by = sy(y2);
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L*off, ny = dx/L*off;
  g.save();
  g.strokeStyle = col || css('--meas'); g.fillStyle = col || css('--meas'); g.lineWidth = 1;
  g.beginPath();
  g.moveTo(ax+nx, ay+ny); g.lineTo(bx+nx, by+ny);
  g.moveTo(ax, ay); g.lineTo(ax+nx*1.18, ay+ny*1.18);
  g.moveTo(bx, by); g.lineTo(bx+nx*1.18, by+ny*1.18);
  g.stroke();
  const tick = 4, ux = dx/L*tick, uy = dy/L*tick;
  g.beginPath();
  g.moveTo(ax+nx-ux-uy*.5, ay+ny-uy+ux*.5); g.lineTo(ax+nx+ux+uy*.5, ay+ny+uy-ux*.5);
  g.moveTo(bx+nx-ux-uy*.5, by+ny-uy+ux*.5); g.lineTo(bx+nx+ux+uy*.5, by+ny+uy-ux*.5);
  g.stroke();
  const mx = (ax+bx)/2 + nx, my = (ay+by)/2 + ny;
  let ang = Math.atan2(dy,dx); if (ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;
  const label = fmtLen(Math.hypot(x2-x1, y2-y1));
  g.translate(mx,my); g.rotate(ang);
  g.font = '600 11px ' + css('--fontNum'); g.textAlign = 'center'; g.textBaseline = 'bottom';
  const tw = g.measureText(label).width;
  g.fillStyle = css('--canvas'); g.globalAlpha = .85;
  g.fillRect(-tw/2-3, -13, tw+6, 13); g.globalAlpha = 1;
  g.fillStyle = col || css('--meas'); g.fillText(label, 0, -2);
  g.restore();
}

/* ---------- rooms + walls ---------- */
function roomPath(r){
  const c = roomPts(r);
  g.beginPath();
  g.moveTo(sx(c[0][0]), sy(c[0][1]));
  for (let i=1;i<c.length;i++) g.lineTo(sx(c[i][0]), sy(c[i][1]));
  g.closePath(); return c;
}
function drawFloor(fl, ghosted){
  g.save(); if (ghosted) g.globalAlpha = .2;
  (fl.rooms||[]).forEach(r => {
    roomPath(r);
    g.fillStyle = r.col || css('--chrome2'); g.globalAlpha = ghosted ? .14 : .55; g.fill();
    g.globalAlpha = ghosted ? .2 : 1;
  });
  const segs = segments(fl);
  g.lineCap = 'butt';
  segs.forEach(s => {
    const op = (fl.openings||[]).filter(o => o.wall === s.key).sort((a,b)=>a.t-b.t);
    const L = segLen(s), tw = Math.max(1.5, s.t*cam.z);
    const ux = (s.x2-s.x1)/(L||1), uy = (s.y2-s.y1)/(L||1);
    let cur = 0;
    const seg = (t0,t1,kind) => {
      if (t1 - t0 < 1e-4) return;
      const ax = sx(s.x1 + ux*L*t0), ay = sy(s.y1 + uy*L*t0);
      const bx = sx(s.x1 + ux*L*t1), by = sy(s.y1 + uy*L*t1);
      g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by);
      if (kind === 'wall'){ g.lineWidth = tw; g.strokeStyle = css('--wall'); g.stroke(); }
      else if (kind === 'door'){
        g.lineWidth = Math.max(1,tw*.3); g.strokeStyle = css('--canvas'); g.stroke();
        const o = curOp || {};
        const hx = o.hinge ? bx : ax, hy = o.hinge ? by : ay;          /* hinge jamb   */
        const fx = o.hinge ? ax : bx, fy = o.hinge ? ay : by;          /* free jamb    */
        const r = Math.hypot(fx-hx, fy-hy), a0 = Math.atan2(fy-hy, fx-hx);
        const side = (o.flip ? 1 : -1) * (o.hinge ? -1 : 1);
        const a1 = a0 + side*Math.PI/2;
        g.beginPath(); g.moveTo(hx,hy); g.arc(hx,hy, r, a0, a1, side < 0);
        g.lineWidth = 1.2; g.strokeStyle = css('--accent'); g.stroke();
        g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx + Math.cos(a1)*r, hy + Math.sin(a1)*r);
        g.lineWidth = 2; g.stroke();
      } else if (kind === 'arch'){
        g.lineWidth = tw; g.strokeStyle = css('--canvas'); g.stroke();
        const nx = -(by-ay)/(Math.hypot(bx-ax,by-ay)||1), ny = (bx-ax)/(Math.hypot(bx-ax,by-ay)||1);
        g.lineWidth = 1.1; g.strokeStyle = css('--ink3'); g.setLineDash([5,5]);
        g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke(); g.setLineDash([]);
        g.lineWidth = Math.max(1.6, tw*.9); g.strokeStyle = css('--wall');
        [[ax,ay],[bx,by]].forEach(([px,py]) => {
          g.beginPath(); g.moveTo(px - nx*tw*.5, py - ny*tw*.5);
          g.lineTo(px + nx*tw*.5, py + ny*tw*.5); g.stroke();
        });
      } else {
        g.lineWidth = tw; g.strokeStyle = css('--canvas'); g.stroke();
        g.lineWidth = Math.max(1.4, tw*.34); g.strokeStyle = css('--meas'); g.stroke();
      }
    };
    op.forEach(o => {
      const half = (o.w/L)/2, a = clamp(o.t-half,0,1), b = clamp(o.t+half,0,1);
      seg(cur, a, 'wall'); curOp = o; seg(a, b, o.type); curOp = null; cur = b;
    });
    seg(cur, 1, 'wall');
  });
  /* room dimension lines */
  if (!ghosted && OPT.dims) (fl.rooms||[]).forEach(r => {
    if (!SEL || SEL.type !== 'room' || SEL.id !== r.id) return;
    const c = roomPts(r);
    const k = r.pts ? c.length : 2;
    for (let i=0;i<k;i++){ const a = c[i], b = c[(i+1)%c.length]; dimLine(a[0],a[1],b[0],b[1],-26); }
  });
  g.restore();
}

/* ---------- items ---------- */
function drawShapes(shapes, w, d, fillSel, own){

  shapes.forEach(sh => {
    if (sh[0] === 'r'){

      const rx = x*SW - ww*SW/2, ry = y*SD - hh*SD/2;
      if (f){ g.fillStyle = cols[f] || cols[1]; g.globalAlpha = f===3?.85:.9; g.fillRect(rx,ry,ww*SW,hh*SD); g.globalAlpha = 1; }
      g.strokeStyle = fillSel; g.lineWidth = 1; g.strokeRect(rx,ry,ww*SW,hh*SD);
    } else if (sh[0] === 'c'){

}
function drawItems(fl, ghosted){

/* ---------- selection ---------- */
function selBox(){

  if (SEL.type === 'text'){ const x = (fl.texts||[]).find(o=>o.id===SEL.id); return x && {x:x.x,y:x.y,w:3,d:1,rot:x.rot||0,o:x}; }

}
function handlePts(b){
  const hw = b.w/2, hd = b.d/2;

  const off = (typeof touchy === 'function' && touchy() ? 46 : 28) / cam.z;

}
function knob(x, y, r, fill){

}
function rotKnob(x, y, r){

  g.save(); g.strokeStyle = css('--onAccent'); g.lineWidth = 1.8;
  g.beginPath(); g.arc(cx, cy, rr, -2.4, 1.9); g.stroke();

}
function drawSel(){

    const H = wallHandles(w);

    g.strokeStyle = css('--accent'); g.lineWidth = Math.max(3, (w.t||.4)*cam.z + 4); g.globalAlpha = .28;
    g.beginPath(); g.moveTo(sx(w.x1), sy(w.y1)); g.lineTo(sx(w.x2), sy(w.y2)); g.stroke(); g.globalAlpha = 1;
    g.setLineDash([4,4]); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(sx(H.mid[0]), sy(H.mid[1])); g.lineTo(sx(H.rot[0]), sy(H.rot[1])); g.stroke(); g.setLineDash([]);
    knob(H.e1[0], H.e1[1], R); knob(H.e2[0], H.e2[1], R);
    if (!w.lock) rotKnob(H.rot[0], H.rot[1], RR);
    g.restore();
    dimLine(w.x1, w.y1, w.x2, w.y2, -24, css('--accent'));
    return;
  }
  const b = selBox(); if (!b) return;
  const { corner, rotH } = handlePts(b);
  g.save();
  g.strokeStyle = css('--accent'); g.lineWidth = 1.6; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(sx(corner[0][0]), sy(corner[0][1]));
  for (let i=1;i<4;i++) g.lineTo(sx(corner[i][0]), sy(corner[i][1]));
  g.closePath(); g.stroke(); g.setLineDash([]);
  if (!b.o.lock){
    g.beginPath(); g.moveTo(sx(b.x), sy(b.y)); g.lineTo(sx(rotH[0]), sy(rotH[1]));
    g.lineWidth = 1; g.stroke();
    if (SEL.type === 'room' && b.o.pts){

    } else {

    dimLine(corner[0][0],corner[0][1],corner[1][0],corner[1][1],-26);
    dimLine(corner[1][0],corner[1][1],corner[2][0],corner[2][1],-26);

}
/* the shape room being drawn, corner by corner */
function drawShapeDraft(){
  if (typeof SHAPE === 'undefined' || !SHAPE) return;

  const all = cur ? P0.concat([cur]) : P0;

  g.save();
  if (all.length >= 3){
    g.beginPath(); g.moveTo(sx(all[0][0]), sy(all[0][1]));
    all.slice(1).forEach(([x,y]) => g.lineTo(sx(x), sy(y))); g.closePath();
    g.fillStyle = css('--accent'); g.globalAlpha = .1; g.fill(); g.globalAlpha = 1;
  }
  g.strokeStyle = css('--accent'); g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(sx(all[0][0]), sy(all[0][1]));
  all.slice(1).forEach(([x,y]) => g.lineTo(sx(x), sy(y))); g.stroke();
  if (all.length >= 3){
    g.setLineDash([5,5]); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(sx(all[all.length-1][0]), sy(all[all.length-1][1])); g.lineTo(sx(all[0][0]), sy(all[0][1])); g.stroke();
    g.setLineDash([]);
  }
  for (let i=1;i<all.length;i++) dimLine(all[i-1][0], all[i-1][1], all[i][0], all[i][1], -16, css('--accent'));
  const T = typeof touchy === 'function' && touchy();
  P0.forEach(([x,y], i) => knob(x, y, i === 0 ? (T ? 12 : 8) : (T ? 6 : 4), i === 0 ? css('--canvas') : css('--accent')));
  if (cur){ g.beginPath(); g.arc(sx(cur[0]), sy(cur[1]), T ? 7 : 4.5, 0, 7); g.fillStyle = css('--accent'); g.fill(); }

}
/* the floating length / angle readout, kept clear of the finger */

  g.fillStyle = css('--onAccent'); g.textAlign = 'center'; g.textBaseline = 'middle';

}
function drawOpenSel(){

/* ---------- ghost preview while drawing ---------- */
function drawGhost(){

  g.save(); g.strokeStyle = css('--accent'); g.lineWidth = 1.6; g.setLineDash([6,4]);
  if (ghost.kind === 'rect'){
    const x = sx(Math.min(ghost.x1,ghost.x2)), y = sy(Math.min(ghost.y1,ghost.y2));

    dimLine(ghost.x1,ghost.y1, ghost.x2,ghost.y2, -18, css('--accent'));

function drawMeasure(){
  if (!measureLine) return;

  g.strokeStyle = css('--meas'); g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(sx(m.x1), sy(m.y1)); g.lineTo(sx(m.x2), sy(m.y2)); g.stroke();
  [[m.x1,m.y1],[m.x2,m.y2]].forEach(([x,y]) => { g.beginPath(); g.arc(sx(x),sy(y),4,0,7); g.fillStyle = css('--meas'); g.fill(); });

/* ---------- main draw ---------- */
function draw(){

/* ===== p_input.js ===== */
/* ===================== 2D interaction ===================== */
const pts = new Map(); let two = null;
let lastPT = 'mouse';                      /* 'mouse' | 'pen' | 'touch' */
let SHAPE = null;                          /* corners of a shape room being drawn */
let LIVE = null;                           /* live readout {sx, sy, text} in screen px */
function evPos(e){ const r = c2.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
const touchy = () => lastPT !== 'mouse';
const HPX = () => touchy() ? 24 : 11;      /* how close a finger must be to grab a handle */

/* ---------- snapping that helps but never forces ---------- */
function snapPts(fl, exceptWall, exceptRoom){
  const out = [];
  (fl.walls||[]).forEach(w => { if (w.id !== exceptWall) out.push([w.x1,w.y1],[w.x2,w.y2]); });
  (fl.rooms||[]).forEach(r => { if (r.id !== exceptRoom) roomPts(r).forEach(p => out.push(p)); });
  return out;
}
/* stick to a nearby wall end or room corner; otherwise the grid step */
function magnet(X, Y, exceptWall, exceptRoom){
  if (OPT.magnet){
    const tol = (touchy() ? 18 : 10) / cam.z;
    let best = null;
    snapPts(F(), exceptWall, exceptRoom).forEach(([px,py]) => {
      const d = Math.hypot(px-X, py-Y);
      if (d < tol && (!best || d < best.d)) best = { d, x:px, y:py };
    });
    if (best) return { x:best.x, y:best.y, hit:true };
  }
  return { x:snapV(X), y:snapV(Y), hit:false };
}
/* nudge to 0 / 45 / 90° only when already very close */
function straighten(x0, y0, x, y){
  if (!OPT.straight) return [x, y];
  const dx = x-x0, dy = y-y0, L = Math.hypot(dx,dy); if (L < 1e-6) return [x, y];
  const a = Math.atan2(dy, dx), step = Math.PI/4, near = Math.round(a/step)*step;
  if (Math.abs(a - near) < 5*Math.PI/180) return [x0 + Math.cos(near)*L, y0 + Math.sin(near)*L];
  return [x, y];
}
/* where a line drawn from (x0,y0) toward the pointer should end */
function lineEnd(x0, y0, X, Y, exceptWall, exceptRoom){
  const m = magnet(X, Y, exceptWall, exceptRoom);
  if (m.hit) return [m.x, m.y];
  let [x, y] = straighten(x0, y0, X, Y);
  if (OPT.snap){
    const dx = x-x0, dy = y-y0, L = Math.hypot(dx,dy);
    if (L > 0){ const L2 = Math.round(L/OPT.snap)*OPT.snap; x = x0 + dx/L*L2; y = y0 + dy/L*L2; }
  }
  return [x, y];
}
const angOf = (x0,y0,x1,y1) => { let a = Math.atan2(-(y1-y0), x1-x0)*180/Math.PI; return (a+360)%360; };
function setLive(p, text){ LIVE = { sx:p.x, sy:p.y, text }; const el = document.getElementById('hint'); if (el) el.textContent = text; }
function clearLive(){ LIVE = null; setHint(); }

/* ---------- what is under the pointer ---------- */
function wallHandles(w){
  const mx = (w.x1+w.x2)/2, my = (w.y1+w.y2)/2, L = Math.hypot(w.x2-w.x1, w.y2-w.y1) || 1;
  const nx = -(w.y2-w.y1)/L, ny = (w.x2-w.x1)/L, off = (touchy() ? 44 : 30) / cam.z;
  return { e1:[w.x1,w.y1], e2:[w.x2,w.y2], rot:[mx + nx*off, my + ny*off], mid:[mx,my] };
}
function hitTest(px, py){

  if (SEL && SEL.type === 'wall'){
    const w = (fl.walls||[]).find(q => q.id === SEL.id);
    if (w){
      const H = wallHandles(w);
      if (Math.hypot(wxp-H.rot[0], wyp-H.rot[1]) < hr) return { type:'handle', h:'wrot' };
      if (Math.hypot(wxp-H.e1[0], wyp-H.e1[1]) < hr) return { type:'handle', h:'we1' };
      if (Math.hypot(wxp-H.e2[0], wyp-H.e2[1]) < hr) return { type:'handle', h:'we2' };
    }
  }
  const b = selBox();
  if (b){
    const { corner, rotH } = handlePts(b);
    if (Math.hypot(wxp-rotH[0], wyp-rotH[1]) < hr) return { type:'handle', h:'rot' };
    if (SEL.type === 'room' && b.o.pts){
      const c = roomPts(b.o);
      for (let i=0;i<c.length;i++) if (Math.hypot(wxp-c[i][0], wyp-c[i][1]) < hr) return { type:'handle', h:'v', i };
    } else {
      for (let i=0;i<4;i++) if (Math.hypot(wxp-corner[i][0], wyp-corner[i][1]) < hr) return { type:'handle', h:i };
    }
  }
  for (let i=(fl.texts||[]).length-1;i>=0;i--){

function nearestWall(px, py){
  const segs = segments(F()); let best = null;
  const wxp = wx(px), wyp = wy(py);
  segs.forEach(s => {
    const h = pointOnSeg(s, wxp, wyp);
    if (!best || h.dist < best.dist) best = { seg:s, ...h };
  });
  return best && best.dist < (touchy() ? 28 : 18)/cam.z ? best : null;
}

function polyAreaSigned(p){ let a = 0; for (let i=0;i<p.length;i++){ const j=(i+1)%p.length; a += p[i][0]*p[j][1]-p[j][0]*p[i][1]; } return a/2; }

function normRoom(r){

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey||e.metaKey) && k === 'z'){ e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
  if ((e.ctrlKey||e.metaKey) && k === 'y'){ redo(); e.preventDefault(); return; }
  if ((e.ctrlKey||e.metaKey) && k === 'd'){ dupSel(); e.preventDefault(); return; }
  if (k === 'delete' || k === 'backspace'){ deleteSel(); e.preventDefault(); return; }
  if (k === 'enter' && TOOL === 'shape'){ finishShape(); return; }
  if (k === 'escape'){ SEL = null; ghost = null; measureLine = null; SHAPE = null; setTool('select'); afterChange(); return; }
  const map = { v:'select', r:'room', s:'shape', w:'wall', d:'door', n:'window', f:'item', m:'measure', h:'pan', l:'text' };
  if (map[k] && !e.shiftKey){ setTool(map[k]); return; }
  if (k === 'g'){ OPT.grid = !OPT.grid; draw(); refreshPanel(); }
  if (k === '0'){ fitView(); }
  if (k === 'r' && e.shiftKey){ rotateSel(90); }
  if (k === '[') rotateSel(-15);
  if (k === ']') rotateSel(15);
});

function wallMesh(gp, s, base, H, ops){

  grp.rotation.y = -ang;
  const put = (a,b,y0,y1) => {
    if (b-a < .002 || y1-y0 < .002) return;

  };

      box3(grp, b - L/2 - .06, (0+hi)/2, 0, .12, hi, s.t*1.06, M3.door);

function stepWalk(dt){

  if (keys3.has('s')||keys3.has('arrowdown')) mf -= 1;
  if (keys3.has('a')) mr -= 1;
  if (keys3.has('d')) mr += 1;

const TOOLS = [
  ['select','tSelect'], ['room','tRoom'], ['shape','tShape'], ['wall','tWall'], ['door','tDoor'], ['window','tWindow'],
  ['item','tItem'], ['text','tText'], ['measure','tMeasure'], ['pan','tPan'], ['-'],
  ['undo','tUndo'], ['redo','tRedo'], ['del','tDelete'], ['fit','tFit']
];
function buildRail(){
  const rail = document.getElementById('rail'); rail.innerHTML = '';
  TOOLS.forEach(([k, lab]) => {
    if (k === '-'){ const s = document.createElement('div'); s.className = 'railgap'; rail.appendChild(s); return; }
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.tool = k; b.title = t(lab);
    b.innerHTML = '<svg viewBox="0 0 20 20">' + ICON[k] + '</svg><i>' + t(lab) + '</i>';
    b.onclick = () => {
      if (k === 'undo') return undo();
      if (k === 'redo') return redo();
      if (k === 'del')  return deleteSel();
      if (k === 'fit')  return fitView();
      setTool(k);
    };
    rail.appendChild(b);
  });
  syncRail();
}
function syncRail(){
  document.querySelectorAll('#rail .tool').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.tool === TOOL ? 'true' : 'false'));
}
function setTool(k){
  if (k !== 'shape') SHAPE = null;
  TOOL = k; ghost = null;
  if (k !== 'measure') measureLine = null;
  if (k === 'item') openTab('cat');
  syncRail(); setHint(); if (typeof syncShapeBar === 'function') syncShapeBar(); draw();
}
function setHint(){
  const map = { select:'hSelect', room:'hRoom', shape:'hShape', wall:'hWall', door:'hDoor', window:'hWindow',
                item:'hItem', measure:'hMeasure', pan:'hPan', text:'hText' };
  const el = document.getElementById('hint');
  if (document.body.dataset.view === '3d'){ el.textContent = t(walk ? 'hWalk' : 'h3d'); return; }
  el.textContent = t(map[TOOL] || 'hSelect');
}

function wireProps(){
  const $ = id => document.getElementById(id);
  const onNum = (id, fn) => { const e = $(id); if (!e) return;
    e.addEventListener('change', () => { push(); fn(parseFloat(e.value)||0); afterChange(); }); };
  const onTxt = (id, fn) => { const e = $(id); if (!e) return;
    e.addEventListener('change', () => { push(); fn(e.value); afterChange(); }); };

  onNum('p_w', v => P.plot.w = clamp(fromU(v), 5, 1200));
  onNum('p_d', v => P.plot.d = clamp(fromU(v), 5, 1200));
  if ($('p_road')) $('p_road').addEventListener('change', e => { push(); P.plot.road = e.target.value; afterChange(); });
  if ($('p_apply')) $('p_apply').onclick = () => {
    const u = $('p_lu').value, a = parseFloat($('p_la').value) || 0;
    const sq = a * SQFT[u]; if (sq < 100) return;
    push();
    const ratio = P.plot.d / P.plot.w || 1.4;
    P.plot.w = Math.sqrt(sq / ratio); P.plot.d = sq / P.plot.w;
    afterChange(); fitView();
  };
  if ($('p_survey')) $('p_survey').onclick = () => openTab('survey');
  if ($('p_lu')) $('p_lu').addEventListener('change', () => {
    $('p_la').value = (plotArea() / SQFT[$('p_lu').value]).toFixed(2);
  });
  document.querySelectorAll('[data-fl]').forEach(r => r.onclick = () => {
    P.active = +r.dataset.fl; SEL = null; afterChange();
  });
  onTxt('f_fname', v => F().name = v);
  onNum('f_fh', v => F().h = clamp(fromU(v), 6, 20));
  if ($('f_add')) $('f_add').onclick = () => {
    push();
    const names = ['ground','first','second','third'];
    P.floors.push(blankFloor(names[P.floors.length] || ('floor ' + (P.floors.length+1))));
    P.active = P.floors.length - 1; SEL = null; afterChange();
  };
  if ($('f_copy')) $('f_copy').onclick = () => {
    push();
    const src = F(), map = {};
    const cp = JSON.parse(JSON.stringify(src));
    cp.id = nid();
    cp.rooms.forEach(r => { const o = r.id; r.id = nid(); map[o] = r.id; });
    cp.walls.forEach(w => { const o = w.id; w.id = nid(); map['w' + o] = w.id; });
    cp.items.forEach(i => i.id = nid()); cp.texts.forEach(x => x.id = nid());
    cp.openings.forEach(o => {
      o.id = nid();
      const p = o.wall.split(':');
      if (p[0] === 'r' && map[p[1]]) o.wall = 'r:' + map[p[1]] + ':' + p[2];
      if (p[0] === 'w' && map['w' + p[1]]) o.wall = 'w:' + map['w' + p[1]];
    });
    const names = ['ground','first','second','third','fourth'];
    cp.name = names[P.floors.length] || ('floor ' + (P.floors.length + 1));
    P.floors.splice(P.active + 1, 0, cp);
    P.active = P.active + 1; SEL = null; afterChange();
  };
  if ($('f_del')) $('f_del').onclick = () => {
    if (P.floors.length < 2) return;
    push(); P.floors.splice(P.active,1); P.active = Math.max(0, P.active-1); SEL = null; afterChange();
  };
  const b = selBox();
  if (b){
    onTxt('f_name', v => b.o.name = v);
    onNum('f_w', v => SEL.type === 'room' ? setRoomSize(b.o, Math.max(.5, fromU(v)), b.o.d) : (b.o.w = Math.max(.5, fromU(v))));
    onNum('f_d', v => SEL.type === 'room' ? setRoomSize(b.o, b.o.w, Math.max(.5, fromU(v))) : (b.o.d = Math.max(.5, fromU(v))));
    onNum('f_x', v => b.o.x = fromU(v));
    onNum('f_y', v => b.o.y = fromU(v));
    onNum('f_rot', v => b.o.rot = ((v%360)+360)%360);
    onNum('f_t', v => b.o.t = clamp(fromU(v), .1, 2));
    onNum('f_h', v => b.o.h = clamp(fromU(v), .1, 20));
    if ($('s_shape')) $('s_shape').onclick = () => { push(); toShape(b.o); afterChange(); };
    const setCol = col => { push(); if (col) b.o.col = col; else delete b.o.col; afterChange(); };
    document.querySelectorAll('.sw2[data-col]').forEach(el => el.onclick = () => setCol(el.dataset.col));
    if ($('s_colpick')) $('s_colpick').addEventListener('change', e => setCol(e.target.value));
    if ($('s_colclear')) $('s_colclear').onclick = () => setCol(null);
  }
  const o = SEL && SEL.type === 'open' && (F().openings||[]).find(x=>x.id===SEL.id);
  if (o){
    onNum('o_w', v => o.w = clamp(fromU(v), .5, 40));
    onNum('o_h', v => o.h = clamp(fromU(v), .5, 14));
    onNum('o_s', v => o.sill = clamp(fromU(v), 0, 9));
    onNum('o_t', v => o.t = clamp(v/100, 0, 1));
    document.querySelectorAll('#o_type button').forEach(bt => bt.onclick = () => {
      push(); o.type = bt.dataset.v;
      if (o.type === 'window' && !o.sill) { o.sill = 3; o.h = Math.min(o.h, 5); }
      if (o.type !== 'window') o.sill = 0;
      if (o.type === 'arch') o.h = Math.max(o.h, 7);
      afterChange();
    });
    if ($('o_flip'))  $('o_flip').onclick  = () => { push(); o.flip  = !o.flip;  afterChange(); };
    if ($('o_hinge')) $('o_hinge').onclick = () => { push(); o.hinge = !o.hinge; afterChange(); };
  }
  const w = SEL && SEL.type === 'wall' && (F().walls||[]).find(x=>x.id===SEL.id);
  if (w){
    onNum('w_t', v => w.t = clamp(fromU(v), .05, 3));
    onNum('w_h', v => w.h = clamp(fromU(v), .5, 30));
    onNum('w_len', v => {                       /* keep the start point and the angle */
      const L = Math.max(.1, fromU(v)), L0 = segLen(w) || 1;
      w.x2 = w.x1 + (w.x2-w.x1)/L0*L; w.y2 = w.y1 + (w.y2-w.y1)/L0*L;
    });
    onNum('w_ang', v => {                       /* keep the start point and the length */
      const L = segLen(w), a = -v*Math.PI/180;
      w.x2 = w.x1 + Math.cos(a)*L; w.y2 = w.y1 + Math.sin(a)*L;
    });
  }
  const x = SEL && SEL.type === 'text' && (F().texts||[]).find(q=>q.id===SEL.id);
  if (x){ onTxt('x_s', v => x.s = v); onNum('x_size', v => x.size = clamp(fromU(v), .3, 12));
          onNum('x_rot', v => x.rot = v); }

let catQ = '';
function thumb(c){
  const W = 100, H = 60, s = Math.min(W/c.w, H/c.d) * .82;
  const ww = c.w*s, dd = c.d*s;
  let p = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  p += `<g transform="translate(${W/2} ${H/2})" stroke="currentColor" stroke-width="1" fill="none">`;
  const fillOf = f => f===1?'rgba(128,128,128,.22)':f===2?'rgba(128,128,128,.42)':f===3?'var(--accent)':f===4?'rgba(128,160,150,.3)':'none';
  c.s.forEach(sh => {
    if (sh[0]==='r') p += `<rect x="${(sh[1]-sh[3]/2)*ww}" y="${(sh[2]-sh[4]/2)*dd}" width="${sh[3]*ww}" height="${sh[4]*dd}" fill="${fillOf(sh[5])}"/>`;
    else if (sh[0]==='c') p += `<circle cx="${sh[1]*ww}" cy="${sh[2]*dd}" r="${sh[3]*Math.min(ww,dd)}" fill="${fillOf(sh[4])}"/>`;
    else p += `<line x1="${sh[1]*ww}" y1="${sh[2]*dd}" x2="${sh[3]*ww}" y2="${sh[4]*dd}"/>`;
  });
  return p + '</g></svg>';
}

function dstamp(ts){
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  const same = d.toDateString() === n.toDateString();
  const p = v => String(v).padStart(2,'0');
  return same ? p(d.getHours()) + ':' + p(d.getMinutes())
              : d.getDate() + '/' + (d.getMonth()+1) + '/' + String(d.getFullYear()).slice(2);
}

function exportPng(){
  const pb = polyBounds(plotPoly());
  const w = (pb.x2-pb.x1) + 8, d = (pb.y2-pb.y1) + 15;
  const z = Math.min(2000/w, 2600/d, 55);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w*z); cv.height = Math.round(d*z);
  const gg = cv.getContext('2d');
  const old = { g, VW, VH, DPR, x:cam.x, y:cam.y, z:cam.z, sel:SEL, ghost, measure:measureLine, below:OPT.below };
  SEL = null; ghost = null; measureLine = null; EXPORTING = true; OPT.below = false;
  g = gg; VW = cv.width; VH = cv.height; DPR = 1;
  cam.x = (pb.x1+pb.x2)/2; cam.y = (pb.y1+pb.y2)/2 + 3.5; cam.z = z;
  gg.setTransform(1,0,0,1,0,0);

            + '   ·   ' + landBreakdown(plotArea()), 18, 16 + z*1.35);

  g = old.g; VW = old.VW; VH = old.VH; DPR = old.DPR;
  cam.x = old.x; cam.y = old.y; cam.z = old.z; SEL = old.sel; ghost = old.ghost; measureLine = old.measure; OPT.below = old.below;
  g.setTransform(DPR,0,0,DPR,0,0); draw();

  modal.hidden = false;

  wireSave(document.getElementById('m_save'), fname, cv, url);

/* Saving a file: inside the Claude viewer this goes through the downloads
   capability; in the standalone build a plain link works. Either way the
   button only appears once we know a save is possible. */
function wireSave(btn, fname, cv, url){
  if (!btn) return;
  const msg = document.getElementById('m_saveMsg');
  const plainLink = () => {
    const a = document.createElement('a');
    if (typeof a.download !== 'string') return false;
    btn.hidden = false;
    btn.onclick = () => { a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); };
    return true;
  };
  if (typeof window.claude === 'undefined' || !window.claude.use){ plainLink(); return; }
  window.claude.use('downloads').then(dl => {
    if (!dl){ plainLink(); return; }
    btn.hidden = false;
    btn.onclick = () => {
      btn.disabled = true;
      cv.toBlob(blob => {
        dl.save({ filename:fname, data:blob })
          .then(() => { btn.disabled = false; msg.textContent = t('saved'); })
          .catch(err => {
            btn.disabled = false;
            msg.textContent = (err && err.code === 'declined') ? '' : t('pngNote');
          });
      }, 'image/png');
    };
  }).catch(() => plainLink());
}

/* ===================== land survey ===================== */
/* The camera records WHICH two pillars a measurement runs between and keeps

function panelSurvey(){

function measRow(kind, i, nm, m){
  const ok = m.len > 0;
  return `<div class="svrow">
    <span class="sw" style="background:${ok?'var(--ok)':'var(--ink3)'}"></span>

        <circle cx="12" cy="12.6" r="3.4"/></svg>

function svArea(s){
  const sides = s.sides.map(m => m.len);
  let diags = s.diags.map(m => m.len);
  if (sides.some(v => !(v > 0))) return 0;
  if (s.n === 4 && !(diags[0] > 0)) return 0;
  const poly = solvePolygon(sides, diags);
  return poly ? polyArea(poly) : 0;
}
function svgShape(s){
  const sides = s.sides.map(m => m.len), diags = s.diags.map(m => m.len);
  let poly = null;
  if (!sides.some(v => !(v > 0)) && !(s.n === 4 && !(diags[0] > 0))) poly = solvePolygon(sides, diags);
  if (!poly){                                            /* idealised preview */
    poly = []; for (let i = 0; i < s.n; i++){
      const a = -Math.PI/2 + i*2*Math.PI/s.n;
      poly.push([Math.cos(a)*10, Math.sin(a)*10]);
    }
  }
  const b = polyBounds(poly), W = 240, H = 150, pad = 24;
  const k = Math.min((W-pad*2)/Math.max(.01,b.x2-b.x1), (H-pad*2)/Math.max(.01,b.y2-b.y1));
  const px = x => W/2 + (x - (b.x1+b.x2)/2)*k, py = y => H/2 + (y - (b.y1+b.y2)/2)*k;
  const pathD = poly.map((p,i) => (i?'L':'M') + px(p[0]).toFixed(1) + ' ' + py(p[1]).toFixed(1)).join(' ') + ' Z';
  let out = `<svg class="svshape" viewBox="0 0 ${W} ${H}" role="img" aria-label="plot shape">
    <path d="${pathD}" fill="rgba(110,170,80,.14)" stroke="var(--land)" stroke-width="1.6"/>`;
  poly.forEach((p,i) => {
    const q = poly[(i+1) % poly.length];
    const mx = (px(p[0])+px(q[0]))/2, my = (py(p[1])+py(q[1]))/2;
    out += `<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="3.4" fill="var(--land)"/>`;
    out += `<text x="${px(p[0]).toFixed(1)}" y="${(py(p[1])-7).toFixed(1)}" font-size="10" font-weight="700"
             fill="var(--ink2)" text-anchor="middle">${CORNER(i)}</text>`;
    out += `<text class="svside" data-i="${i}" x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-size="9.5"
             fill="var(--accent)" text-anchor="middle" style="cursor:pointer">${
               s.sides[i] && s.sides[i].len > 0 ? fmtLen(s.sides[i].len) : '?'}</text>`;
  });
  return out + '</svg>';
}

function startCamera(){
  const v = document.getElementById('camVid'), msg = document.getElementById('cam_msg');
  if (camState && camState.frozen) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.textContent = t('camNo'); v.hidden = true; return;
  }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 } }, audio:false })
    .then(st => {
      camState.stream = st; v.srcObject = st;
      v.play().catch(()=>{});
      v.onloadedmetadata = () => { sizeOverlay(); drawMarks(); };
    })
    .catch(err => {
      v.hidden = true;
      msg.textContent = (err && err.name === 'NotAllowedError') ? t('camDenied') : t('camNo');
    });
  if (navigator.xr && navigator.xr.isSessionSupported){
    navigator.xr.isSessionSupported('immersive-ar').then(ok => {
      const b = document.getElementById('arBanner'); if (b && ok) b.hidden = false;
    }).catch(()=>{});
  }
}
function stopCamera(){
  if (camState && camState.stream){ camState.stream.getTracks().forEach(tr => tr.stop()); camState.stream = null; }
}
function sizeOverlay(){
  const wrap = document.getElementById('camWrap'), ov = document.getElementById('camOv');
  if (!wrap || !ov) return;
  const r = wrap.getBoundingClientRect();
  ov.width = Math.round(r.width); ov.height = Math.round(r.height);
}
function drawMarks(){
  const ov = document.getElementById('camOv'); if (!ov) return;
  sizeOverlay();
  const c = ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
  const pts = (camState && camState.marks) || [];
  const P2 = pts.map(p => [p.x*ov.width, p.y*ov.height]);
  if (P2.length === 2){
    c.strokeStyle = css('--accent'); c.lineWidth = 3; c.setLineDash([9,6]);
    c.beginPath(); c.moveTo(P2[0][0],P2[0][1]); c.lineTo(P2[1][0],P2[1][1]); c.stroke();
    c.setLineDash([]);
  }
  P2.forEach(([x,y], i) => {
    c.strokeStyle = css('--accent'); c.fillStyle = 'rgba(255,122,24,.22)'; c.lineWidth = 3;
    c.beginPath(); c.arc(x,y,16,0,7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(x-26,y); c.lineTo(x-7,y); c.moveTo(x+7,y); c.lineTo(x+26,y);
    c.moveTo(x,y-26); c.lineTo(x,y-7); c.moveTo(x,y+7); c.lineTo(x,y+26); c.stroke();
    c.fillStyle = css('--accent');
    c.font = '700 13px ' + css('--fontNum'); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(i+1), x, y - 34);
  });
  const tag = document.getElementById('camTag');
  if (tag) tag.textContent = pts.length === 0 ? t('tapPillar1')
                           : pts.length === 1 ? t('tapPillar2') : t('bothMarked');
  const cp = document.getElementById('cam_pts');
  if (cp) cp.value = pts.length + ' / 2';
}
