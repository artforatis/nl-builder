/* ---------- AR ruler: the camera measures the distance itself ---------- */
function arSupported(){
  return !!(navigator.xr && navigator.xr.isSessionSupported);
}
function arMeasure(){
  const msg = document.getElementById('cam_msg');
  const say = txt => { if (msg) msg.textContent = txt; };
  if (!navigator.xr){ say(t('arNo')); return; }
  say(t('arStarting'));
  stopCamera();

  /* full-screen overlay drawn on top of the AR camera feed */
  let ov = document.getElementById('arOverlay');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'arOverlay';
  ov.innerHTML = `
    <div id="arTop"><div id="arTip">${esc(t('arReady'))}</div></div>
    <div id="arBot">
      <div id="arRead"><b id="arBig">0.00</b><span id="arSub">${esc(t('arTotal'))} · 0 ${esc(t('arPoints'))}</span></div>
      <div id="arBtns">
        <button id="ar_undo" class="arb">${esc(t('arUndo'))}</button>
        <button id="ar_mark" class="arb big">${esc(t('arMark'))}</button>
        <button id="ar_done" class="arb ok">${esc(t('arDone'))}</button>
        <button id="ar_exit" class="arb">${esc(t('close'))}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const cvs = document.createElement('canvas');
  cvs.id = 'arCanvas';
  document.body.appendChild(cvs);

  const feats = { requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay','light-estimation'], domOverlay:{ root: ov } };
  navigator.xr.requestSession('immersive-ar', feats)
    .catch(() => navigator.xr.requestSession('immersive-ar', { requiredFeatures:['hit-test'] }))
    .then(s => runAR(s, cvs, ov, say))
    .catch(() => { ov.remove(); cvs.remove(); say(t('arNo')); });
}

function runAR(session, cvs, ov, say){
  const $ = id => document.getElementById(id);
  const renderer = new THREE.WebGLRenderer({ canvas:cvs, alpha:true, antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.autoClear = true;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 60);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.1));

  /* reticle: the ring that sits on the ground where the tablet is aiming */
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.055, 0.075, 40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xff7a18, side:THREE.DoubleSide })
  );
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(0.012, 24).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xffffff })
  );
  ring.add(dot);
  ring.matrixAutoUpdate = false; ring.visible = false;
  scene.add(ring);

  const group = new THREE.Group(); scene.add(group);
  const pegGeo = new THREE.SphereGeometry(0.035, 16, 12);
  const pegMat = new THREE.MeshBasicMaterial({ color:0xff7a18 });
  const lineMat = new THREE.LineBasicMaterial({ color:0xffffff });
  let liveLine = null;

  const pts = [];                 /* THREE.Vector3, metres, local space */
  let hitSrc = null, ref = null, reticlePos = null, ended = false;

  const dist = (a,b) => a.distanceTo(b);
  const total = () => { let d = 0; for (let i=1;i<pts.length;i++) d += dist(pts[i-1], pts[i]); return d; };
  const show = () => {
    const m = total();
    let live = m;
    if (pts.length >= 1 && reticlePos && pts.length < 2) live = m + dist(pts[pts.length-1], reticlePos);
    else if (pts.length >= 1 && reticlePos) live = m + dist(pts[pts.length-1], reticlePos);
    const ft = (pts.length ? live : 0) * FT_PER_M;
    const fixed = m * FT_PER_M;
    $('arBig').textContent = fmtLen(ft);
    $('arSub').textContent = t('arTotal') + ' ' + fmtLen(fixed) + ' · ' + pts.length + ' ' + t('arPoints');
    $('arTip').textContent = pts.length === 0 ? t('arHint') : t('arWalk');
  };

  const rebuild = () => {
    while (group.children.length) group.remove(group.children[0]);
    pts.forEach(p => { const m = new THREE.Mesh(pegGeo, pegMat); m.position.copy(p); group.add(m); });
    if (pts.length >= 2){
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      group.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color:0xff7a18 })));
    }
    show();
  };

  const addPoint = () => {
    if (!reticlePos) return;
    pts.push(reticlePos.clone());
    rebuild();
  };

  $('ar_mark').onclick = addPoint;
  $('ar_undo').onclick = () => { pts.pop(); rebuild(); };
  $('ar_exit').onclick = () => { session.end(); };
  $('ar_done').onclick = () => {
    if (pts.length < 2){ $('arTip').textContent = t('arNeed2'); return; }
    const ft = total() * FT_PER_M;
    session.end();
    const box = document.getElementById('cam_len');
    if (box){ box.value = fmt(ft); }
    say(t('arGot') + ' ' + fmtLen(ft));
  };
  session.addEventListener('select', addPoint);

  const resize = () => {
    cam.aspect = window.innerWidth/window.innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  };
  resize(); window.addEventListener('resize', resize);

  renderer.xr.setSession(session).then(async () => {
    ref = renderer.xr.getReferenceSpace();
    const viewer = await session.requestReferenceSpace('viewer');
    hitSrc = await session.requestHitTestSource({ space: viewer });
    show();
  });

  renderer.setAnimationLoop((time, frame) => {
    if (!frame || !hitSrc) { renderer.render(scene, cam); return; }
    const space = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitSrc);
    if (hits.length){
      const pose = hits[0].getPose(space);
      if (pose){
        ring.visible = true;
        ring.matrix.fromArray(pose.transform.matrix);
        reticlePos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
        if (pts.length){
          if (liveLine) group.remove(liveLine);
          const g = new THREE.BufferGeometry().setFromPoints([pts[pts.length-1], reticlePos]);
          liveLine = new THREE.Line(g, lineMat); group.add(liveLine);
        }
        show();
      }
    } else {
      ring.visible = false;
      if ($('arTip') && pts.length === 0) $('arTip').textContent = t('arLook');
    }
    renderer.render(scene, cam);
  });

  session.addEventListener('end', () => {
    if (ended) return; ended = true;
    renderer.setAnimationLoop(null);
    window.removeEventListener('resize', resize);
    try { renderer.dispose(); } catch(e){}
    cvs.remove(); ov.remove();
    if (!modal.hidden && !(camState && camState.frozen)) startCamera();
  });
}

/* ===== p_house.js ===== */
/* ===================== the real plot & house ===================== *
 * Surveyed on site:  N 37'0"   E (road) 29'5"   S 37'0"   W 30'3"
 * diagonal A->C 43'0"   =>  1,088 ft²  (2.49 shotok / 1.51 katha)
 * The road is on the EAST, so the front door faces east.
 * The house follows the land's own shape (the plot leans about 10°),
 * kept 2 ft off the north, south and west boundaries and 4 ft off
 * the road boundary:  785 ft² on each floor.
 * Model space:  +x = east,  -y = north,  +y = south.
 * Furniture convention: an item's back is its local -y side.
 * ================================================================ */
function loadHouse(){
  P = blankProject();
  const BN = LANG === 1;
  P.name = BN ? 'আমাদের বাড়ি' : 'Our house';
  P.unit = 'ft';
  uid = 1;

  P.survey = {
    n: 4,
    sides: [ { len:37.06, photo:null, p1:null, p2:null },
             { len:29.46, photo:null, p1:null, p2:null },
             { len:37.06, photo:null, p1:null, p2:null },
             { len:30.28, photo:null, p1:null, p2:null } ],
    diags: [ { len:43.06, photo:null, p1:null, p2:null } ]
  };
  P.plot = { w:37, d:30, road:'east',
             poly: solvePolygon([37.06,29.46,37.06,30.28],[43.06]) };

  /* ---------- outline of the house ---------- */
  const YN = -12.914;                                     /* north face */
  const xW = y => -14.242 - 0.1748 * (y - YN);           /* west face  */
  const xE = y =>  16.712 - 0.1802 * (y - YN);           /* east face  */
  const yS = x =>  12.163 + 0.02253 * (12.194 - x);      /* south face */
  const SE = [12.194, 12.163], SW = [-18.748, 12.860];

  const XA = -7.5;     /* stair & kitchen | dining & drawing */
  const XB =  2.0;     /* dining | bedroom block            */
  const YA =  2.0;     /* north half | south half           */
  const YB = -2.5;     /* bedroom | entry                    */

  /* ---------- helpers ---------- */
  const room = (fl, name, pts, t, h) => { const r = shapeRoom(name, pts, t); if (h) r.h = h; fl.rooms.push(r); return r; };
  const size = (k, w, d) => { const c = CATBY[k]; return [w ?? c.w, d ?? c.d]; };
  const put = (fl, k, x, y, rot, w, d) => {
    const c = CATBY[k]; if (!c) return;
    fl.items.push({ id:nid(), k, x:+x.toFixed(3), y:+y.toFixed(3), rot:rot||0, w: w ?? c.w, d: d ?? c.d, h: c.h });
  };
  const G0 = .25;                                          /* half wall + a hair */
  /* back against an outside face */
  const onN = (fl,k,x,w,d) => { const [W,D]=size(k,w,d); put(fl,k,x, YN+G0+D/2, 0, W,D); };
  const onS = (fl,k,x,w,d) => { const [W,D]=size(k,w,d); put(fl,k,x, yS(x)-G0-D/2, 180, W,D); };
  const onW = (fl,k,y,w,d) => { const [W,D]=size(k,w,d), o=G0+D/2; put(fl,k, xW(y)+.985*o, y+.172*o, 280, W,D); };
  const onE = (fl,k,y,w,d) => { const [W,D]=size(k,w,d), o=G0+D/2; put(fl,k, xE(y)-.984*o, y-.177*o, 100, W,D); };
  /* back against an inside wall: x = X (dir +1: item east of it), y = Y (dir +1: item south of it) */
  const onX = (fl,k,X,dir,y,w,d) => { const [W,D]=size(k,w,d); put(fl,k, X+dir*(G0+D/2), y, dir>0?270:90, W,D); };
  const onY = (fl,k,Y,dir,x,w,d) => { const [W,D]=size(k,w,d); put(fl,k, x, Y+dir*(G0+D/2), dir>0?0:180, W,D); };
  const free = (fl,k,x,y,rot,w,d) => put(fl,k,x,y,rot,w,d);

  /* an opening on whichever wall of room r is nearest to (x, y) */
  const op = (fl, r, x, y, type, w, h, sill) => {
    const c = roomPts(r), n = c.length;
    const names = n === 4 ? ['n','e','s','w'] : c.map((_,i) => 'p'+i);
    let best = null;
    for (let i=0;i<n;i++){
      const a = c[i], b = c[(i+1)%n];
      const dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy;
      let tt = ((x-a[0])*dx + (y-a[1])*dy) / L2; tt = clamp(tt, 0, 1);
      const d = Math.hypot(x - (a[0]+dx*tt), y - (a[1]+dy*tt));
      if (!best || d < best.d) best = { d, i, tt, L:Math.sqrt(L2) };
    }
    const ww = Math.min(w, best.L - .1), half = (ww/best.L)/2;
    fl.openings.push({ id:nid(), wall:'r:'+r.id+':'+names[best.i],
                       t: clamp(best.tt, half, 1-half), type, w:ww, h, sill: sill ?? 0 });
  };
  /* open plan: the shared wall is not there */
  const open2 = (fl, a, b, x, y, w) => { op(fl, a, x, y, 'arch', w, 9.4, 0); op(fl, b, x, y, 'arch', w, 9.4, 0); };
  /* a door between two rooms: cut through both walls, swing drawn into room a */
  const door2 = (fl, a, b, x, y, w, h) => { op(fl, a, x, y, 'door', w, h||7, 0); op(fl, b, x, y, 'arch', w, h||7, 0); };
  const wall = (fl, x1,y1,x2,y2, t) => fl.walls.push({ id:nid(), x1,y1,x2,y2, t:t??.4 });

  /* ============================ GROUND ============================ */
  const G = P.floors[0]; G.name = 'ground'; G.h = 10;

  const wc    = room(G, BN?'ওয়াশরুম':'Guest WC',
                     [[xW(YN), YN], [XA, YN], [XA, -9.4], [xW(-9.4), -9.4]]);
  const stair = room(G, BN?'সিঁড়ি':'Stair',
                     [[xW(-9.4), -9.4], [XA, -9.4], [XA, YA], [xW(YA), YA]]);
  const dine  = room(G, BN?'ডাইনিং':'Dining',
                     [[XA, YN], [XB, YN], [XB, YB], [xE(YB), YB], [xE(YA), YA], [XA, YA]]);
  const bath1 = room(G, BN?'অ্যাটাচ বাথ':'Attached bath',
                     [[XB, YN], [6.8, YN], [6.8, -8.0], [XB, -8.0]]);
  const bed1  = room(G, BN?'বেডরুম':'Bedroom',
                     [[6.8, YN], [xE(YN), YN], [xE(YB), YB], [XB, YB], [XB, -8.0], [6.8, -8.0]]);
  const kitc  = room(G, BN?'ওপেন কিচেন':'Open kitchen',
                     [[xW(YA), YA], [XA, YA], [XA, yS(XA)], SW]);
  const draw  = room(G, BN?'ড্রয়িং রুম':'Drawing room',
                     [[XA, YA], [xE(YA), YA], SE, [XA, yS(XA)]]);

  open2(G, stair, dine, XA, -3.7, 11.0);         /* stair  | dining  */
  open2(G, stair, kitc, -12.18, YA, 9.2);        /* stair  | kitchen */
  open2(G, dine,  draw, 3.26, YA, 20.6);         /* dining | drawing */
  open2(G, kitc,  draw, XA, 7.3, 9.6);           /* kitchen| drawing */

  op(G, dine, xE(-0.25), -0.25, 'door', 3.6, 8, 0);  /* front door, from the road */
  door2(G, bed1,  dine,  XB, -5.4, 3.0);              /* faces the stair           */
  door2(G, bath1, bed1,  3.2, -8.0, 2.2);
  door2(G, wc,    dine,  XA, -11.15, 2.4);

  op(G, bed1,  xE(-6.0), -6.0, 'window', 6,   5.5, 1.5);   /* bay window seat, east */
  op(G, bed1,  15.0, YN, 'window', 2.4, 4.5, 3);
  op(G, bath1, 4.4,  YN, 'window', 2.4, 2.4, 5);
  op(G, wc,  -11.0,  YN, 'window', 2,   2,   5.5);
  op(G, dine, -2.5, YN, 'window', 4.4, 3.4, 4.2);           /* above the sideboard */
  op(G, stair, xW(-5.0), -5.0, 'window', 3.2, 7, 2.5);       /* tall stair window   */
  op(G, kitc, -11.0, yS(-11.0), 'window', 4, 3, 4.2);         /* above the counter   */
  op(G, kitc,  xW(9.8), 9.8, 'window', 2.6, 3, 4.2);
  op(G, draw,  -4.6, yS(-4.6), 'window', 4,   5,   2.6);
  op(G, draw,   9.4, yS(9.4),  'window', 3.6, 5,   2.6);

  /* ---- drawing room: sofa faces the TV on the south wall ---- */
  free(G,'rug',      3.3,  7.4,   0, 10, 6.4);
  onS (G,'tv_unit',  3.3);
  free(G,'sofa3',    3.3,  4.7,   0);
  free(G,'coffee',   3.3,  7.6,   0);
  onE (G,'sofa2',    7.0);
  free(G,'armchair',-4.6,  7.6, 270);
  onS (G,'plant',   -6.3);
  onS (G,'plant',   11.0, 1.4, 1.4);

  /* ---- open kitchen: counter round the south-west corner ---- */
  onS (G,'counter', -10.85, 6, 2);
  onS (G,'cooker',  -15.35);
  onW (G,'sink',      8.2);
  onW (G,'counter',   5.85, 2.5, 2);
  onW (G,'fridge',    3.35);

  /* ---- dining ---- */
  free(G,'dine6',   -2.75, -5.6, 90);
  onN (G,'cabinet', -2.5, 4.4, 1.4);                /* sideboard            */
  onN (G,'basin',   -6.15);                           /* wash basin, dining   */
  onN (G,'plant',    0.75);
  onY (G,'cabinet',  YB, 1, 8.0, 3.6, 1.2);          /* shoe cabinet         */

  /* ---- stair: floating treads ---- */
  free(G,'stair_f', -9.85, -2.45, 0, 4.0, 13.4);
  free(G,'plant',  -14.4, -1.0, 0);

  /* ---- ground bedroom ---- */
  free(G,'rug',      9.0, -5.8,   0, 7.5, 5.4);
  onY (G,'bed_d',    YB, -1, 10.0);                  /* head to the south    */
  onY (G,'side_tbl', YB, -1, 6.6);
  onY (G,'side_tbl', YB, -1, 13.4);
  onX (G,'wardrobe', 6.8, 1, -11.05, 3.2, 2);        /* on the bath wall     */
  onN (G,'dresser',  12.0);
  /* baths */
  onN (G,'toilet',   3.1);
  onN (G,'basin',    5.45);
  free(G,'shower',   5.4, -9.65, 0, 2.0, 2.2);
  onN (G,'toilet', -12.6);
  onN (G,'basin',  -10.7);

  /* ---- outside: gate and plants in the front strip ---- */
  free(G,'gate',     18.25, -0.25, 100, 7, .4);
  free(G,'plant',    17.6,  -8.0,  0);
  free(G,'plant',    15.2,   6.6,  0);

  /* ============================ FIRST ============================= */
  const F1 = blankFloor('first'); F1.h = 10; P.floors.push(F1);

  const land  = room(F1, BN?'সিঁড়ির ল্যান্ডিং':'Stair landing',
                     [[xW(YN), YN], [XA, YN], [XA, -9.4], [xW(-9.4), -9.4]]);
  const loun  = room(F1, BN?'ফ্যামিলি লাউঞ্জ':'Family lounge',
                     [[XA, YN], [XB, YN], [XB, YA], [XA, YA]]);
  const mbath = room(F1, BN?'মাস্টার বাথ':'Master bath',
                     [[XB, YN], [6.6, YN], [6.6, -8.3], [XB, -8.3]]);
  const balc  = room(F1, BN?'বারান্দা':'Balcony',
                     [[11.8, -10.4], [xE(-10.4), -10.4], [xE(-5.2), -5.2], [11.8, -5.2]]);
  const mast  = room(F1, BN?'মাস্টার বেডরুম':'Master bedroom',
                     [[6.6, YN], [xE(YN), YN], [xE(-10.4), -10.4], [11.8, -10.4], [11.8, -5.2],
                      [xE(-5.2), -5.2], [xE(YA), YA], [XB, YA], [XB, -8.3], [6.6, -8.3]]);
  const bed3  = room(F1, BN?'বেডরুম ৩':'Bedroom 3',
                     [[xW(YA), YA], [-2.5, YA], [-2.5, 7.9], [-7.0, 7.9], [-7.0, yS(-7.0)], SW]);
  const bath3 = room(F1, BN?'অ্যাটাচ বাথ':'Attached bath',
                     [[-7.0, 7.9], [-2.5, 7.9], [-2.5, yS(-2.5)], [-7.0, yS(-7.0)]]);
  const bath2 = room(F1, BN?'অ্যাটাচ বাথ':'Attached bath',
                     [[-2.5, 7.9], [2.0, 7.9], [2.0, yS(2.0)], [-2.5, yS(-2.5)]]);
  const bed2  = room(F1, BN?'বেডরুম ২':'Bedroom 2',
                     [[-2.5, YA], [xE(YA), YA], SE, [2.0, yS(2.0)], [2.0, 7.9], [-2.5, 7.9]]);

  /* stair well: open to the floor below */
  open2(F1, land, loun, XA, -11.15, 3.3);
  op(F1, loun, XA, -3.7, 'arch', 11.0, 9.4, 0);          /* no wall over the well */
  op(F1, land, -11.1, -9.4, 'arch', 7.3, 9.4, 0);
  wall(F1, xW(-9.4), -9.4, xW(YA), YA, .4);              /* west face over the well */
  free(F1,'railing', -7.3, -3.7, 90, 11.0, .3);
  /* flight to the roof, beside the first one */
  free(F1,'stair_f', -13.25, -3.6, 180, 2.7, 11.2);

  door2(F1, mast,  loun, XB, -5.0, 2.8);
  door2(F1, mbath, mast, 3.2, -8.3, 2.4);
  door2(F1, mast,  balc, 11.8, -7.8, 3.0, 8);             /* glass door to the balcony */
  door2(F1, bed2,  loun, -0.25, YA, 2.8);
  door2(F1, bed3,  loun, -5.0, YA, 2.8);
  door2(F1, bath2, bed2, 0.7, 7.9, 2.2);
  door2(F1, bath3, bed3, -3.7, 7.9, 2.2);

  /* windows */
  op(F1, balc, xE(-7.8), -7.8, 'window', 4.8, 6.4, 1.1);  /* glass + iron grill, east */
  op(F1, mast,  xE(-12.0), -12.0, 'window', 2.0, 4.5, 3);
  op(F1, mast,  xE(1.0), 1.0, 'window', 1.6, 4.0, 3.4);
  op(F1, mast,  9.4, YN, 'window', 4.0, 2.0, 6.4);         /* high strip over the TV */
  op(F1, mbath, 4.3, YN, 'window', 2.4, 2.4, 5);
  op(F1, loun, -2.75, YN, 'window', 5, 2.6, 5.4);          /* high, over the sofa */
  op(F1, land, -11.0, YN, 'window', 3, 4.5, 3);
  op(F1, bed2,  xE(7.4), 7.4, 'window', 6, 5.5, 1.5);     /* bay seat, east */

  op(F1, bath2, 0.75, yS(0.75), 'window', 1.8, 2.4, 5);
  op(F1, bed3,  xW(7.4), 7.4, 'window', 6, 5.5, 1.5);     /* bay seat, west */
  op(F1, bath3, -4.4, yS(-4.4), 'window', 1.8, 2.4, 5);

  /* ---- family lounge ---- */
  free(F1,'rug',      -2.75, -7.2,   0, 7.5, 7.5);
  onN (F1,'sofa3',    -2.75);
  free(F1,'armchair', -5.0,  -3.65, 180);
  free(F1,'armchair', -0.5,  -3.65, 180);
  free(F1,'coffee',   -2.75, -7.4,   0);
  onX (F1,'shelf',     XB, -1, 0.1, 3.0, 1.2);

  /* ---- master bedroom ---- */
  free(F1,'rug',       9.0, -3.4,   0, 9, 6);
  onY (F1,'bed_k',     YA, -1, 9.0);                 /* head to the south wall */
  onY (F1,'side_tbl',  YA, -1, 4.95);
  onY (F1,'side_tbl',  YA, -1, 12.95);
  onN (F1,'tv_unit',   9.4, 4, 1.4);                 /* faces the bed          */
  onN (F1,'shelf',    13.6, 2.6, 1.2);               /* showcase, built in     */
  onX (F1,'desk',      XB, 1, -1.6, 3.6, 2);         /* computer table         */
  free(F1,'offchair',  4.7, -1.6, 90);
  onE (F1,'wardrobe', -2.4, 4.0, 2);
  /* master bath */
  onX (F1,'toilet',    XB, 1, -11.6);
  onN (F1,'basin',     5.55, 1.7, 1.6);
  free(F1,'shower',    5.4, -9.65, 0, 2.0, 2.2);
  /* balcony, facing east */
  free(F1,'chair',    13.2, -9.2, 280);
  free(F1,'chair',    12.9, -6.6, 280);
  onE (F1,'plant',    -9.3, 1.2, 1.2);

  /* ---- bedroom 2 (south-east, bay seat to the road) ---- */
  free(F1,'rug',       7.0,  6.6,   0, 7.5, 5.4);
  onY (F1,'bed_d',     YA, 1, 7.0);                  /* head to the north wall */
  onY (F1,'side_tbl',  YA, 1, 3.65);
  onY (F1,'side_tbl',  YA, 1, 10.35);
  onX (F1,'wardrobe',  2.0, 1, 10.0, 3.8, 2);
  onS (F1,'toilet',   -1.5);
  onY (F1,'basin',     7.9, 1, -1.35, 1.8, 1.6);
  free(F1,'shower',    0.75, 11.3, 0, 1.8, 1.8);

  /* ---- bedroom 3 (west, bay seat to the west) ---- */
  free(F1,'rug',     -12.0,  6.4,   0, 7.5, 5.4);
  onY (F1,'bed_d',     YA, 1, -12.4);
  onY (F1,'side_tbl',  YA, 1, -15.55);
  onY (F1,'side_tbl',  YA, 1, -9.25);
  onX (F1,'wardrobe', -7.0, -1, 10.0, 3.8, 2);
  onS (F1,'desk',    -14.0, 3.6, 2);
  free(F1,'chair',   -14.0, 9.7, 0);
  onS (F1,'toilet',   -3.5);
  onY (F1,'basin',     7.9, 1, -5.9, 1.8, 1.6);
  free(F1,'shower',   -5.85, 11.4, 0, 1.8, 1.8);

  /* ============================= ROOF ============================= */
  const R = blankFloor('roof'); R.h = 3.5; P.floors.push(R);
  const head = room(R, BN?'সিঁড়ি ঘর':'Stair head',
                    [[xW(-5.5), -5.5], [-9.5, -5.5], [-9.5, YA], [xW(YA), YA]], .5, 7.6);
  const terr = room(R, BN?'ছাদ':'Roof terrace',
                    [[xW(YN), YN], [xE(YN), YN], SE, SW, [xW(YA), YA], [-9.5, YA], [-9.5, -5.5], [xW(-5.5), -5.5]], .5);
  door2(R, head, terr, -9.5, -0.6, 3.2, 7);              /* steel door to the roof */
  op(R, head, xW(-2.5), -2.5, 'window', 2, 2, 4.6);
  onN (R,'tank', -0.6);
  onN (R,'tank',  4.8);
  free(R,'dine4', 4.4, 5.0, 0);
  free(R,'chair', 4.4, 2.6, 0);    free(R,'chair', 4.4, 7.4, 180);
  free(R,'chair', 2.0, 5.0, 270);  free(R,'chair', 6.8, 5.0, 90);
  onS (R,'plant',  10.0);  onS (R,'plant', -15.6);
  onE (R,'plant',   1.0);

  P.active = 0; SEL = null;
}

function setView(v){
  document.body.dataset.view = v;
  document.getElementById('v2d').setAttribute('aria-pressed', v === '2d');
  document.getElementById('v3d').setAttribute('aria-pressed', v === '3d');
  if (v === '3d'){
    if (!init3d()){ document.getElementById('hint').textContent = '3D engine not available offline.'; return; }
    if (!world) place3d();
    dirty3 = true;
    if (!raf3){ last3 = performance.now(); loop3(); }
  } else { walk = false; }
  syncWalkBtn(); setHint();
  try { localStorage.setItem('nlbuilder.view', v); } catch(e){}
}
/* walk button + joystick live over the 3D canvas */
function buildWalkUI(){
  const stage = document.getElementById('stage');
  const b = document.createElement('button');
  b.id = 'walkBtn'; b.className = 'btn pri';
  b.style.cssText = 'position:absolute;right:14px;bottom:14px;z-index:6';
  b.onclick = () => { walk = !walk; if (walk) walkStart(); syncWalkBtn(); setHint(); };
  stage.appendChild(b);
  const o = document.createElement('button');
  o.id = 'onlyBtn'; o.className = 'btn';
  o.style.cssText = 'position:absolute;right:14px;bottom:60px;z-index:6';
  o.onclick = () => { ONLY = !ONLY; dirty3 = true; syncWalkBtn(); };
  stage.appendChild(o);
  const j = document.createElement('div');
  j.id = 'joyPad';
  j.style.cssText = 'position:absolute;left:18px;bottom:18px;width:128px;height:128px;border-radius:50%;'
    + 'background:color-mix(in srgb,var(--chrome) 80%,transparent);border:1px solid var(--line);'
    + 'touch-action:none;z-index:6;backdrop-filter:blur(6px)';
  j.innerHTML = '<div id="joyKnob" style="position:absolute;left:41px;top:41px;width:46px;height:46px;'
    + 'border-radius:50%;background:var(--accent);pointer-events:none"></div>';
  stage.appendChild(j);
  let jid = null;
  const move = e => {
    const r = j.getBoundingClientRect(), max = r.width/2 - 18;
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const d = Math.hypot(dx,dy); if (d > max){ dx *= max/d; dy *= max/d; }
    document.getElementById('joyKnob').style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx/max; joy.y = -dy/max;
  };
  j.addEventListener('pointerdown', e => { jid = e.pointerId; j.setPointerCapture(e.pointerId); move(e); e.stopPropagation(); });
  j.addEventListener('pointermove', e => { if (e.pointerId === jid) move(e); });
  const end = e => { if (e.pointerId === jid){ jid = null; joy.x = joy.y = 0;
    document.getElementById('joyKnob').style.transform = ''; } };
  j.addEventListener('pointerup', end); j.addEventListener('pointercancel', end);
  syncWalkBtn();
}
function syncWalkBtn(){
  const b = document.getElementById('walkBtn'), j = document.getElementById('joyPad'),
        o = document.getElementById('onlyBtn');
  if (!b) return;
  const is3 = document.body.dataset.view === '3d';
  b.hidden = !is3; j.hidden = !(is3 && walk); o.hidden = !is3;
  b.textContent = walk ? t('exitWalk') : t('walkBtn');
  o.textContent = t('onlyFloor'); o.setAttribute('aria-pressed', ONLY);
}

/* ---------- boot ---------- */
function init(){
  try { const u = localStorage.getItem('nlbuilder.unit'); if (u) UNIT = u; } catch(e){}
  try { const l = localStorage.getItem('nlbuilder.lang'); if (l) LANG = +l; } catch(e){}
  try { const th = localStorage.getItem('nlbuilder.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
  if (!load()){ loadHouse(); PID = newPid(); }
  if (!P.plot.hasOwnProperty('poly')) P.plot.poly = null;
  ensureSurvey();
  if (!PID) PID = newPid();
  saveNow();
  buildRail(); buildWalkUI();
  document.querySelectorAll('#sideTabs button').forEach(b => b.onclick = () => openTab(b.dataset.tab));
  document.getElementById('v2d').onclick = () => setView('2d');
  document.getElementById('v3d').onclick = () => setView('3d');
  document.getElementById('uft').onclick = () => { UNIT = 'ft'; applyUnit(); };
  document.getElementById('um').onclick  = () => { UNIT = 'm';  applyUnit(); };
  document.getElementById('len').onclick = () => { LANG = 0; try{localStorage.setItem('nlbuilder.lang','0');}catch(e){} applyI18n(); };
  document.getElementById('lbn').onclick = () => { LANG = 1; try{localStorage.setItem('nlbuilder.lang','1');}catch(e){} applyI18n(); };
  document.getElementById('btnHelp').onclick = showHelp;
  document.getElementById('sideToggle').onclick = () =>
    document.body.dataset.side = document.body.dataset.side === 'open' ? '' : 'open';
  document.getElementById('btnTheme').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('nlbuilder.theme', next); } catch(e){}
    draw();
  };
  const ro = new ResizeObserver(() => { resize2d(); draw(); });
  ro.observe(document.getElementById('stage'));
  window.addEventListener('resize', () => { resize2d(); draw(); });
  resize2d(); applyUnit(); applyI18n(); setTool('select'); fitView();
  let v = '2d'; try { v = localStorage.getItem('nlbuilder.view') || '2d'; } catch(e){}
  setView(v);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
