<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161b1f">
<meta name="description" content="NL Builder — design your house plan in 2D and 3D, in Bangla or English.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NL Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* NL Builder — a drafting instrument: dark graphite chrome, blueprint canvas,
   signal-orange for the thing you are holding, cyan for every measurement. */
:root{
  --bg:#0f1316; --chrome:#161b1f; --chrome2:#1d242a; --panel:#131a1e;
  --line:#2a343b; --line2:#39454e;
  --ink:#e9efec; --ink2:#9aa8a2; --ink3:#6b7a74;
  --canvas:#0c1013; --grid:#1a242b; --gridMaj:#27353e; --paper:#0c1013;
  --accent:#ff7a18; --accent2:#ffa45c;
  --meas:#35c8d8; --land:#8bd450; --wall:#cfd8d4; --wallFill:#404c53;
  --danger:#ff5566; --ok:#5ad18a; --onAccent:#140c05;
  --fontUI:'IBM Plex Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fontBN:'Hind Siliguri','IBM Plex Sans',system-ui,sans-serif;
  --fontNum:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rs:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eef1ed; --chrome:#f6f8f4; --chrome2:#e7ebe6; --panel:#fbfcfa;
    --line:#d4dbd4; --line2:#bcc6bd;
    --ink:#151a17; --ink2:#5b665f; --ink3:#8a948d;
    --canvas:#fbfcf8; --grid:#e2e8e1; --gridMaj:#cdd6cc; --paper:#fbfcf8;
    --accent:#d1540a; --accent2:#a8420a;
    --meas:#0d7f8c; --land:#4e8b22; --wall:#2a332e; --wallFill:#c3ccc5;
    --danger:#c62d3e; --ok:#1d7a4a; --onAccent:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1ed; --chrome:#f6f8f4; --chrome2:#e7ebe6; --panel:#fbfcfa;
  --line:#d4dbd4; --line2:#bcc6bd;
  --ink:#151a17; --ink2:#5b665f; --ink3:#8a948d;
  --canvas:#fbfcf8; --grid:#e2e8e1; --gridMaj:#cdd6cc; --paper:#fbfcf8;
  --accent:#d1540a; --accent2:#a8420a;
  --meas:#0d7f8c; --land:#4e8b22; --wall:#2a332e; --wallFill:#c3ccc5;
  --danger:#c62d3e; --ok:#1d7a4a; --onAccent:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--fontUI);
  font-size:14px; overflow:hidden; -webkit-tap-highlight-color:transparent;
}
body[data-lang="bn"]{font-family:var(--fontBN)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--fontNum);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;}
#top{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
#mid{display:grid;grid-template-columns:auto 1fr auto;min-height:0;position:relative;overflow:hidden}
#stage{position:relative;min-width:0;background:var(--canvas);overflow:hidden}
#c2d,#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c3d{display:none}
body[data-view="3d"] #c2d{display:none}
body[data-view="3d"] #c3d{display:block}
#bottom{
  display:flex;align-items:center;gap:14px;padding:6px 12px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--chrome);border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2);overflow-x:auto;white-space:nowrap
}
#bottom .sep{width:1px;height:16px;background:var(--line);flex:none}

/* ---------- tool rail ---------- */
#rail{
  width:60px;background:var(--chrome);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto
}
.tool{
  width:48px;height:46px;border:1px solid transparent;border-radius:var(--rs);
  background:transparent;cursor:pointer;display:grid;place-items:center;gap:2px;
  grid-template-rows:20px auto;color:var(--ink2);transition:background .12s,color .12s
}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool i{font-style:normal;font-size:9px;letter-spacing:.02em;line-height:1}
.tool:hover{background:var(--chrome2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tool:focus-visible{outline:2px solid var(--meas);outline-offset:1px}
.railgap{height:10px;border-top:1px solid var(--line);margin:4px 2px}

/* ---------- side panel ---------- */
#side{
  width:290px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
#sideTabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#sideTabs button{
  flex:1;padding:10px 4px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink3);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em
}
#sideTabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#sideBody{flex:1;overflow-y:auto;padding:12px;min-height:0}
.sec{margin-bottom:16px}
.sec>h3{
  margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3)
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row.one{grid-template-columns:1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:10px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.fld input,.fld select{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:7px 8px;font-family:var(--fontNum);font-size:13px;min-width:0;width:100%
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld.txt input{font-family:var(--fontUI)}
.btn{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap
}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}
.btn.dgr{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{padding:6px 9px;font-size:11.5px}
.btn:focus-visible{outline:2px solid var(--meas);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--chrome2);border-color:var(--accent);color:var(--accent)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* catalogue */
.catsearch{width:100%;background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin-bottom:10px}
.catsearch:focus{outline:none;border-color:var(--accent)}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.citem{
  background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);
  padding:7px 6px 6px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center
}
.citem:hover{border-color:var(--accent)}
.citem[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--chrome2))}
.citem svg{width:100%;height:30px}
.citem b{font-size:10.5px;font-weight:600;line-height:1.15}
.citem em{font-style:normal;font-size:9px;color:var(--ink3);font-family:var(--fontNum)}

/* list */
.lst{display:flex;flex-direction:column;gap:4px}
.lrow{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--rs);
  background:var(--chrome2);border:1px solid var(--line);cursor:pointer;font-size:12.5px
}
.lrow:hover{border-color:var(--line2)}
.lrow[aria-selected="true"]{border-color:var(--accent)}
.lrow .sw{width:9px;height:9px;border-radius:2px;background:var(--ink3);flex:none}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .va{font-family:var(--fontNum);font-size:11px;color:var(--ink3)}

/* stat strip */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 9px}
.stat b{display:block;font-family:var(--fontNum);font-size:16px;font-weight:600;letter-spacing:-.01em}
.stat span{display:block;font-size:10px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.stat.wide{grid-column:1/-1}

/* segmented */
.seg{display:inline-flex;background:var(--chrome2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--ink3)
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.seg.ghost button[aria-pressed="true"]{background:var(--chrome);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button:focus-visible{outline:2px solid var(--meas);outline-offset:1px}

/* floating hint + modal */
#hint{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(10px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--chrome) 92%,transparent);
  border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12.5px;
  color:var(--ink2);pointer-events:none;backdrop-filter:blur(8px);max-width:90%;text-align:center
}
#modal{position:fixed;inset:0;background:rgba(4,7,9,.72);display:grid;place-items:center;padding:18px;z-index:50}
#modal[hidden]{display:none}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto
}
.card h2{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 14px;color:var(--ink2);font-size:13px;line-height:1.5}
.card textarea{
  width:100%;height:170px;background:var(--chrome2);border:1px solid var(--line);
  border-radius:var(--rs);padding:10px;font-family:var(--fontNum);font-size:11.5px;resize:vertical
}
.card textarea:focus{outline:none;border-color:var(--accent)}
.help{font-size:12.5px;line-height:1.65;color:var(--ink2)}
.help h4{margin:14px 0 5px;font-size:12.5px;color:var(--ink)}
.help ul{margin:0;padding-left:18px}
.help li{margin-bottom:4px}
.kbd{font-family:var(--fontNum);font-size:11px;background:var(--chrome2);border:1px solid var(--line);
     border-radius:4px;padding:1px 5px}

/* survey */
.note{margin:0 0 9px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.svshape{width:100%;height:auto;background:var(--chrome2);border:1px solid var(--line);border-radius:var(--rs);margin-top:4px}
.svrow{display:grid;grid-template-columns:10px 1fr 74px 34px 38px;align-items:center;gap:7px;
  padding:6px 8px;border-radius:var(--rs);background:var(--chrome2);border:1px solid var(--line)}
.svrow .nm{font-size:12.5px;font-weight:600;font-family:var(--fontNum)}
.svrow input{background:var(--chrome);border:1px solid var(--line);border-radius:5px;
  padding:5px 6px;font-family:var(--fontNum);font-size:12px;width:100%;min-width:0}
.svrow input:focus{outline:none;border-color:var(--accent)}
.svthumb{width:34px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer}
.svthumb.empty{background:var(--chrome);display:block}
.svcam{padding:5px 0;width:100%;font-size:14px;line-height:1}
#camWrap{position:relative;width:100%;aspect-ratio:4/3;background:#07090b;border-radius:var(--rs);
  overflow:hidden;border:1px solid var(--line)}
#camVid,#camShot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#camOv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#camTag{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(10,14,17,.76);
  color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;pointer-events:none}

/* tablet: roomier targets, wider panel (Galaxy Tab S11 Ultra and friends) */
@media (min-width:1100px){
  #side{width:340px}
  #rail{width:70px}
  .tool{width:58px;height:54px}
  .tool svg{width:22px;height:22px}
  .tool i{font-size:9.5px}
}
@media (pointer:coarse){
  .fld input,.fld select{padding:10px 10px;font-size:15px}
  .btn{padding:11px 14px;font-size:13.5px}
  .btn.sm{padding:9px 11px;font-size:12.5px}
  .seg button{padding:10px 16px;font-size:13px}
  #sideTabs button{padding:13px 4px;font-size:12.5px}
  .lrow{padding:11px 10px;font-size:13.5px}
  .svrow{grid-template-columns:10px 1fr 84px 38px 44px;padding:9px 9px}
  .svrow input{padding:8px 7px;font-size:13px}
  .citem b{font-size:11.5px}
}
/* mobile */
#sideToggle,#railToggle{display:none}
@media (max-width:900px){
  #mid{grid-template-columns:auto 1fr}
  #side{
    position:absolute;right:0;top:0;bottom:0;z-index:20;width:min(300px,86vw);
    box-shadow:-14px 0 36px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .22s ease
  }
  body[data-side="open"] #side{transform:none}
  #sideToggle{display:inline-flex}
  #rail{width:52px}
  .tool{width:40px;height:42px}
}
@media (max-width:620px){
  .brand span{display:none}
  #top{gap:7px;padding:7px 9px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
  .seg button{padding:6px 10px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- AR ruler overlay ---------- */
#arCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:9998;background:transparent}
#arOverlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;font-family:var(--fontUI);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body[data-lang="bn"] #arOverlay{font-family:var(--fontBN)}
#arTop{padding:16px}
#arTip{pointer-events:none;display:inline-block;max-width:560px;background:rgba(8,10,12,.74);color:#fff;
  padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.45;backdrop-filter:blur(6px)}
#arBot{pointer-events:auto;background:rgba(9,11,13,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.14);
  padding:16px 16px 20px;display:flex;flex-direction:column;gap:13px;align-items:center}
#arRead{text-align:center;color:#fff}
#arBig{display:block;font-family:var(--fontNum);font-size:46px;font-weight:700;letter-spacing:-.5px;line-height:1}
#arSub{display:block;margin-top:6px;font-size:13px;opacity:.76}
#arBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arb{pointer-events:auto;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;
  padding:13px 18px;border-radius:12px;font:600 14px/1 var(--fontUI);cursor:pointer;backdrop-filter:blur(6px)}
body[data-lang="bn"] .arb{font-family:var(--fontBN)}
.arb:active{transform:translateY(1px)}
.arb.big{background:var(--accent);border-color:var(--accent);color:var(--onAccent);padding:15px 40px;font-size:16px}
.arb.ok{background:rgba(255,255,255,.92);color:#101316;border-color:transparent}
.btn.wide{width:100%;justify-content:center}
#arBanner{margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--chrome2)}
#arBanner .note{margin:8px 0 0}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><b>NL BUILDER</b><span data-i="tagline">Home design studio</span></div>
    <div class="seg" role="group" aria-label="View">
      <button id="v2d" aria-pressed="true" data-i="v2d">2D Plan</button>
      <button id="v3d" aria-pressed="false" data-i="v3d">3D View</button>
    </div>
    <div class="seg ghost" role="group" aria-label="Units">
      <button id="uft" aria-pressed="true">ft</button>
      <button id="um" aria-pressed="false">m</button>
    </div>
    <div style="flex:1"></div>
    <div class="seg ghost" role="group" aria-label="Language">
      <button id="len" aria-pressed="true">EN</button>
      <button id="lbn" aria-pressed="false">বাংলা</button>
    </div>
    <button class="btn sm" id="btnTheme" title="Theme">◐</button>
    <button class="btn sm" id="btnHelp" data-i="help">Help</button>
    <button class="btn sm" id="sideToggle" data-i="panel">Panel</button>
  </header>

  <div id="mid">
    <nav id="rail" aria-label="Tools"></nav>
    <div id="stage">
      <canvas id="c2d"></canvas>
      <canvas id="c3d"></canvas>
      <div id="hint"></div>
    </div>
    <aside id="side">
      <div id="sideTabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="props" data-i="tabProps">Properties</button>
        <button role="tab" aria-selected="false" data-tab="cat" data-i="tabCat">Catalogue</button>
        <button role="tab" aria-selected="false" data-tab="survey" data-i="tabSurvey">Survey</button>
        <button role="tab" aria-selected="false" data-tab="proj" data-i="tabProj">Project</button>
      </div>
      <div id="sideBody"></div>
    </aside>
  </div>

  <footer id="bottom">
    <span id="stCursor" class="num">0.00, 0.00 ft</span>
    <span class="sep"></span>
    <span id="stScale" class="num">1 ft</span>
    <span class="sep"></span>
    <span id="stFloor"></span>
    <span class="sep"></span>
    <span id="stSel" data-i="nothingSel">Nothing selected</span>
    <span style="flex:1"></span>
    <span id="stSave" style="color:var(--ink3)"></span>
  </footer>
</div>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>

<script src="three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')}</script>
<script>
/* ===== p_i18n.js ===== */
/* ===================== language ===================== */
const T = {
  tagline:['Home design studio','হোম ডিজাইন স্টুডিও'],
  v2d:['2D Plan','২ডি প্ল্যান'], v3d:['3D View','৩ডি ভিউ'],
  help:['Help','সাহায্য'], panel:['Panel','প্যানেল'],
  tabProps:['Properties','প্রোপার্টি'], tabCat:['Catalogue','আসবাব'], tabProj:['Project','প্রজেক্ট'],
  nothingSel:['Nothing selected','কিছু সিলেক্ট করা নেই'],

  tSelect:['Select','সিলেক্ট'], tRoom:['Room','রুম'], tWall:['Wall','দেয়াল'],
  tDoor:['Door','দরজা'], tWindow:['Window','জানালা'], tItem:['Place','বসান'],
  tMeasure:['Measure','মাপ'], tPan:['Pan','সরান'], tText:['Label','লেখা'],

let LANG = 0;                                   /* 0 = en, 1 = bn */
const t = k => (T[k] ? (T[k][LANG] ?? T[k][0]) : k);

/* ===== p_model.js ===== */
/* ===================== units ===================== */
const FT_PER_M = 3.280839895;
const SQFT = { katha:720, shotok:435.6, bigha:14400, sqft:1 };
let UNIT = 'ft';                                        /* display unit      */
const toU   = ft => UNIT === 'ft' ? ft : ft / FT_PER_M; /* feet -> display   */
const fromU = v  => UNIT === 'ft' ? v  : v * FT_PER_M;  /* display -> feet   */
const uname = () => UNIT === 'ft' ? 'ft' : 'm';
const fmt = (ft, dp) => toU(ft).toFixed(dp === undefined ? 2 : dp);
const fmtU = (ft, dp) => fmt(ft, dp) + ' ' + uname();
function fmtLen(ft){                                    /* 12' 6" or 3.81 m  */
  if (UNIT === 'm') return toU(ft).toFixed(2) + ' m';
  const whole = Math.floor(Math.abs(ft));
  const inch = Math.round((Math.abs(ft) - whole) * 12);
  const w2 = inch === 12 ? whole + 1 : whole, i2 = inch === 12 ? 0 : inch;
  return (ft < 0 ? '-' : '') + w2 + "'" + (i2 ? ' ' + i2 + '"' : '');
}
function fmtArea(sqft){
  if (UNIT === 'm') return (sqft / (FT_PER_M * FT_PER_M)).toFixed(1) + ' m²';
  return Math.round(sqft).toLocaleString('en-US') + ' ft²';
}
function landBreakdown(sqft){
  return [ (sqft / SQFT.katha).toFixed(2) + ' ' + t('katha'),
           (sqft / SQFT.shotok).toFixed(2) + ' ' + t('shotok') ].join('  ·  ');
}

function blankMeasure(){ return { len:0, photo:null, p1:null, p2:null }; }
function ensureSurvey(){
  if (!P.survey) P.survey = { n:4, sides:[], diags:[] };
  const s = P.survey, n = clamp(s.n || 4, 3, 8);
  s.n = n;
  while (s.sides.length < n) s.sides.push(blankMeasure());
  s.sides.length = n;
  const nd = Math.max(0, n - 3);                       /* fan diagonals from corner A */
  while (s.diags.length < nd) s.diags.push(blankMeasure());
  s.diags.length = nd;
  return s;
}

/* ===================== geometry helpers ===================== */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const snapV = v => OPT.snap ? Math.round(v / OPT.snap) * OPT.snap : v;
const d2 = (ax,ay,bx,by) => (ax-bx)**2 + (ay-by)**2;

/* every wall segment on a floor, with a stable key */
function segments(fl){
  const out = [];
  (fl.rooms||[]).forEach(r => {
    const hw = r.w/2, hd = r.d/2, t = r.t ?? 0.4;
    const c = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y]) => rot2(x,y,r.rot||0,r.x,r.y));
    const sides = ['n','e','s','w'];
    for (let i=0;i<4;i++){
      const a = c[i], b = c[(i+1)%4];
      out.push({ key:'r:'+r.id+':'+sides[i], x1:a[0], y1:a[1], x2:b[0], y2:b[1], t, room:r.id, side:sides[i] });
    }
  });
  (fl.walls||[]).forEach(w => out.push({ key:'w:'+w.id, x1:w.x1, y1:w.y1, x2:w.x2, y2:w.y2, t:w.t ?? 0.4, free:w.id }));
  return out;
}
function rot2(x,y,deg,cx,cy){
  const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
  return [cx + x*c - y*s, cy + x*s + y*c];
}
function segLen(s){ return Math.hypot(s.x2-s.x1, s.y2-s.y1); }
function pointOnSeg(s, px, py){            /* -> {t, dist} */
  const dx = s.x2-s.x1, dy = s.y2-s.y1, L2 = dx*dx + dy*dy || 1;
  let tt = ((px-s.x1)*dx + (py-s.y1)*dy) / L2;
  tt = clamp(tt, 0, 1);
  const qx = s.x1 + dx*tt, qy = s.y1 + dy*tt;
  return { t:tt, dist:Math.hypot(px-qx, py-qy), x:qx, y:qy };
}
function roomArea(r){ return r.w * r.d; }
/* shoelace */
function polyArea(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[(i+1) % pts.length];
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a) / 2;
}
function polyBounds(pts){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x1:Math.min(...xs), x2:Math.max(...xs), y1:Math.min(...ys), y2:Math.max(...ys) };
}
/* two circle intersections, or null when they cannot meet */
function circleInt(ax,ay,ra, bx,by,rb){
  const dx = bx-ax, dy = by-ay, d = Math.hypot(dx,dy);
  if (d < 1e-9 || d > ra + rb + 1e-6 || d < Math.abs(ra - rb) - 1e-6) return null;
  const a = (ra*ra - rb*rb + d*d) / (2*d);
  const h2 = ra*ra - a*a, h = Math.sqrt(Math.max(0, h2));
  const mx = ax + a*dx/d, my = ay + a*dy/d;
  return [[mx + h*dy/d, my - h*dx/d], [mx - h*dy/d, my + h*dx/d]];
}
/* Build the real land shape from measured sides and the diagonals taken
   from corner A — the way a chain survey is worked out on paper.       */
function solvePolygon(sides, diags){
  const n = sides.length;
  if (n < 3) return null;
  if (sides.some(v => !(v > 0))) return null;
  const pts = [[0,0], [sides[0], 0]];
  for (let i = 2; i < n; i++){
    const rB = sides[i-1];
    const rA = (i <= n-2) ? diags[i-2] : sides[n-1];
    if (!(rA > 0) || !(rB > 0)) return null;
    const hit = circleInt(0, 0, rA, pts[i-1][0], pts[i-1][1], rB);
    if (!hit) return null;
    /* keep turning the same way: pick the point on the far side of the
       line through the two previous corners */
    const [px,py] = pts[i-1], [qx,qy] = pts[i-2];
    const cross = p => (px-qx)*(p[1]-qy) - (py-qy)*(p[0]-qx);
    pts.push(cross(hit[0]) >= cross(hit[1]) ? hit[0] : hit[1]);
  }
  /* centre it on the origin */
  const b = polyBounds(pts), cx = (b.x1+b.x2)/2, cy = (b.y1+b.y2)/2;
  return pts.map(([x,y]) => [x - cx, y - cy]);
}
function plotPoly(){
  if (P.plot.poly && P.plot.poly.length >= 3) return P.plot.poly;
  const hw = P.plot.w/2, hd = P.plot.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]];
}
function builtArea(fl){ return (fl.rooms||[]).reduce((a,r) => a + roomArea(r), 0); }
function plotArea(){ return (P.plot.poly && P.plot.poly.length >= 3) ? polyArea(P.plot.poly) : P.plot.w * P.plot.d; }
function inPlot(x,y){
  const pts = plotPoly(); let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++){
    const [xi,yi] = pts[i], [xj,yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi) + xi)) inside = !inside;
  }
  return inside;
}

/* ===================== 2D plan ===================== */
const c2 = document.getElementById('c2d');
let g = c2.getContext('2d');
const cam = { x:0, y:0, z:9 };            /* world centre + pixels per foot */
let VW = 0, VH = 0, DPR = 1;
let TOOL = 'select', PICK = 'bed_d';

function resize2d(){
  const r = c2.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = r.width; VH = r.height;
  c2.width = Math.max(1, Math.round(VW*DPR)); c2.height = Math.max(1, Math.round(VH*DPR));
  g.setTransform(DPR,0,0,DPR,0,0);
}
const sx = wx => VW/2 + (wx - cam.x) * cam.z;
const sy = wy => VH/2 + (wy - cam.y) * cam.z;
const wx = px => cam.x + (px - VW/2) / cam.z;
const wy = py => cam.y + (py - VH/2) / cam.z;
function fitView(){
  const pad = 52, b = polyBounds(plotPoly());
  const w = (b.x2-b.x1) + 18, d = (b.y2-b.y1) + 18;
  cam.z = clamp(Math.min((VW-pad*2)/w, (VH-pad*2)/d), 1.2, 160);
  cam.x = (b.x1+b.x2)/2; cam.y = (b.y1+b.y2)/2;
  draw();
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- grid + scale ---------- */
function drawGrid(){
  const minor = UNIT === 'ft' ? 1 : fromU(1), major = minor*5;
  const x0 = wx(0), x1 = wx(VW), y0 = wy(0), y1 = wy(VH);
  if (OPT.grid && minor*cam.z > 4){
    g.lineWidth = 1; g.strokeStyle = css('--grid'); g.beginPath();
    for (let x = Math.ceil(x0/minor)*minor; x < x1; x += minor){ const p = Math.round(sx(x))+.5; g.moveTo(p,0); g.lineTo(p,VH); }
    for (let y = Math.ceil(y0/minor)*minor; y < y1; y += minor){ const p = Math.round(sy(y))+.5; g.moveTo(0,p); g.lineTo(VW,p); }
    g.stroke();
  }
  if (OPT.grid && major*cam.z > 10){
    g.lineWidth = 1; g.strokeStyle = css('--gridMaj'); g.beginPath();
    for (let x = Math.ceil(x0/major)*major; x < x1; x += major){ const p = Math.round(sx(x))+.5; g.moveTo(p,0); g.lineTo(p,VH); }
    for (let y = Math.ceil(y0/major)*major; y < y1; y += major){ const p = Math.round(sy(y))+.5; g.moveTo(0,p); g.lineTo(VW,p); }
    g.stroke();

}
function drawScaleBar(){

  const steps = UNIT === 'ft' ? [1,2,5,10,20,50,100] : [0.5,1,2,5,10,20,50].map(fromU);
  let unitLen = steps[steps.length-1];

  const px = unitLen*cam.z, x = 16, y = VH-20;

  g.beginPath(); g.moveTo(x,y-3); g.lineTo(x+px/2,y-3); g.lineTo(x+px/2,y); g.lineTo(x,y); g.closePath(); g.fill();
  g.font = '600 11px ' + css('--fontNum');

}
function drawCompass(){

/* ---------- land ---------- */
function drawPlot(){
  const pts = plotPoly(), b = polyBounds(pts);
  g.save();
  g.beginPath();

  for (let i = 1; i < pts.length; i++) g.lineTo(sx(pts[i][0]), sy(pts[i][1]));

  pts.forEach(([x,y], i) => {
    g.beginPath(); g.arc(sx(x), sy(y), 4.5, 0, 7);

  g.fillStyle = css('--line'); g.globalAlpha = .5;
  if (R === 'north') g.fillRect(X, Y-rw-6, W, rw);

  if (R === 'west'){ g.save(); g.translate(X-rw/2-6, Y+D/2); g.rotate(-Math.PI/2); g.fillText(rl,0,0); g.restore(); }
  if (R === 'east'){ g.save(); g.translate(X+W+rw/2+6, Y+D/2); g.rotate(Math.PI/2); g.fillText(rl,0,0); g.restore(); }
  g.restore();
  /* one dimension per boundary side */
  for (let i = 0; i < pts.length; i++){

/* dimension line offset perpendicular by `off` screen px */
function dimLine(x1,y1,x2,y2,off,col){
  const ax = sx(x1), ay = sy(y1), bx = sx(x2), by = sy(y2);
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L*off, ny = dx/L*off;
  g.save();
  g.strokeStyle = col || css('--meas'); g.fillStyle = col || css('--meas'); g.lineWidth = 1;
  g.beginPath();
  g.moveTo(ax+nx, ay+ny); g.lineTo(bx+nx, by+ny);
  g.moveTo(ax, ay); g.lineTo(ax+nx*1.18, ay+ny*1.18);
  g.moveTo(bx, by); g.lineTo(bx+nx*1.18, by+ny*1.18);
  g.stroke();
  const tick = 4, ux = dx/L*tick, uy = dy/L*tick;
  g.beginPath();
  g.moveTo(ax+nx-ux-uy*.5, ay+ny-uy+ux*.5); g.lineTo(ax+nx+ux+uy*.5, ay+ny+uy-ux*.5);
  g.moveTo(bx+nx-ux-uy*.5, by+ny-uy+ux*.5); g.lineTo(bx+nx+ux+uy*.5, by+ny+uy-ux*.5);
  g.stroke();
  const mx = (ax+bx)/2 + nx, my = (ay+by)/2 + ny;
  let ang = Math.atan2(dy,dx); if (ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;
  const label = fmtLen(Math.hypot(x2-x1, y2-y1));
  g.translate(mx,my); g.rotate(ang);
  g.font = '600 11px ' + css('--fontNum'); g.textAlign = 'center'; g.textBaseline = 'bottom';
  const tw = g.measureText(label).width;
  g.fillStyle = css('--canvas'); g.globalAlpha = .85;
  g.fillRect(-tw/2-3, -13, tw+6, 13); g.globalAlpha = 1;
  g.fillStyle = col || css('--meas'); g.fillText(label, 0, -2);
  g.restore();
}

/* ---------- rooms + walls ---------- */
function roomPath(r){
  const hw = r.w/2, hd = r.d/2;
  const c = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y]) => rot2(x,y,r.rot||0,r.x,r.y));
  g.beginPath();
  g.moveTo(sx(c[0][0]), sy(c[0][1]));
  for (let i=1;i<4;i++) g.lineTo(sx(c[i][0]), sy(c[i][1]));
  g.closePath(); return c;
}
function drawFloor(fl, ghosted){
  g.save(); if (ghosted) g.globalAlpha = .2;
  (fl.rooms||[]).forEach(r => {
    roomPath(r);
    g.fillStyle = r.col || css('--chrome2'); g.globalAlpha = ghosted ? .14 : .55; g.fill();
    g.globalAlpha = ghosted ? .2 : 1;
  });
  const segs = segments(fl);
  g.lineCap = 'butt';
  segs.forEach(s => {
    const op = (fl.openings||[]).filter(o => o.wall === s.key).sort((a,b)=>a.t-b.t);
    const L = segLen(s), tw = Math.max(1.5, s.t*cam.z);
    const ux = (s.x2-s.x1)/(L||1), uy = (s.y2-s.y1)/(L||1);
    let cur = 0;
    const seg = (t0,t1,kind) => {
      if (t1 - t0 < 1e-4) return;
      const ax = sx(s.x1 + ux*L*t0), ay = sy(s.y1 + uy*L*t0);
      const bx = sx(s.x1 + ux*L*t1), by = sy(s.y1 + uy*L*t1);
      g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by);
      if (kind === 'wall'){ g.lineWidth = tw; g.strokeStyle = css('--wall'); g.stroke(); }
      else if (kind === 'door'){
        g.lineWidth = Math.max(1,tw*.3); g.strokeStyle = css('--canvas'); g.stroke();
        const r = Math.hypot(bx-ax, by-ay);
        g.beginPath(); g.moveTo(ax,ay);
        g.arc(ax,ay, r, Math.atan2(by-ay,bx-ax), Math.atan2(by-ay,bx-ax) - Math.PI/2, true);
        g.lineWidth = 1.2; g.strokeStyle = css('--accent'); g.stroke();
        g.beginPath(); g.moveTo(ax,ay);
        g.lineTo(ax + Math.cos(Math.atan2(by-ay,bx-ax)-Math.PI/2)*r, ay + Math.sin(Math.atan2(by-ay,bx-ax)-Math.PI/2)*r);
        g.lineWidth = 2; g.stroke();
      } else {
        g.lineWidth = tw; g.strokeStyle = css('--canvas'); g.stroke();
        g.lineWidth = Math.max(1.4, tw*.34); g.strokeStyle = css('--meas'); g.stroke();
      }
    };
    op.forEach(o => {
      const half = (o.w/L)/2, a = clamp(o.t-half,0,1), b = clamp(o.t+half,0,1);
      seg(cur, a, 'wall'); seg(a, b, o.type); cur = b;
    });
    seg(cur, 1, 'wall');
  });
  /* room names and areas */
  if (!ghosted) (fl.rooms||[]).forEach(r => {
    const px = sx(r.x), py = sy(r.y);
    if (OPT.labels && r.name){
      const fs = clamp(r.w*cam.z/9, 9, 15);
      g.font = '600 ' + fs.toFixed(0) + 'px ' + css('--fontUI');
      g.textAlign = 'center'; g.textBaseline = 'bottom';
      const tw = g.measureText(r.name).width, ty = py - (OPT.areas ? 2 : -5);
      g.fillStyle = css('--canvas'); g.globalAlpha = .78;
      g.fillRect(px - tw/2 - 4, ty - fs - 1, tw + 8, fs + 4); g.globalAlpha = 1;
      g.fillStyle = css('--ink'); g.fillText(r.name, px, ty);
    }
    if (OPT.areas){
      const fs2 = clamp(r.w*cam.z/11, 8, 12);
      g.font = '500 ' + fs2.toFixed(0) + 'px ' + css('--fontNum');
      g.textAlign = 'center'; g.textBaseline = 'top';
      const s2 = fmtLen(r.w) + ' × ' + fmtLen(r.d), tw2 = g.measureText(s2).width;
      g.fillStyle = css('--canvas'); g.globalAlpha = .78;
      g.fillRect(px - tw2/2 - 4, py + 2, tw2 + 8, fs2 + 3); g.globalAlpha = 1;
      g.fillStyle = css('--ink3'); g.fillText(s2, px, py + 3);
    }
  });
  /* room dimension lines */
  if (!ghosted && OPT.dims) (fl.rooms||[]).forEach(r => {
    if (!SEL || SEL.type !== 'room' || SEL.id !== r.id) return;
    const hw = r.w/2, hd = r.d/2;
    const c = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y]) => rot2(x,y,r.rot||0,r.x,r.y));
    dimLine(c[0][0],c[0][1],c[1][0],c[1][1],-26);
    dimLine(c[1][0],c[1][1],c[2][0],c[2][1],-26);
  });
  g.restore();
}

/* ---------- items ---------- */
function drawShapes(shapes, w, d, fillSel){
  const SW = w*cam.z, SD = d*cam.z;
  const cols = [null, css('--chrome2'), css('--wallFill'), css('--accent'), css('--meas')];
  shapes.forEach(sh => {
    if (sh[0] === 'r'){
      const [,x,y,ww,hh,f] = sh;
      const rx = x*SW - ww*SW/2, ry = y*SD - hh*SD/2;
      if (f){ g.fillStyle = cols[f] || cols[1]; g.globalAlpha = f===3?.85:.9; g.fillRect(rx,ry,ww*SW,hh*SD); g.globalAlpha = 1; }
      g.strokeStyle = fillSel; g.lineWidth = 1; g.strokeRect(rx,ry,ww*SW,hh*SD);
    } else if (sh[0] === 'c'){
      const [,x,y,r,f] = sh;
      const rr = r*Math.min(SW,SD);
      g.beginPath(); g.arc(x*SW, y*SD, Math.max(1,rr), 0, 7);
      if (f){ g.fillStyle = cols[f] || cols[1]; g.globalAlpha = .9; g.fill(); g.globalAlpha = 1; }
      g.strokeStyle = fillSel; g.lineWidth = 1; g.stroke();
    } else {
      const [,x1,y1,x2,y2] = sh;
      g.beginPath(); g.moveTo(x1*SW, y1*SD); g.lineTo(x2*SW, y2*SD);

}
function drawItems(fl, ghosted){

}
function drawTexts(fl){
  (fl.texts||[]).forEach(tx => {
    g.save(); g.translate(sx(tx.x), sy(tx.y)); g.rotate((tx.rot||0)*Math.PI/180);
    g.font = '600 ' + Math.max(8, (tx.size||1)*cam.z) + 'px ' + css('--fontUI');
    g.fillStyle = css('--ink'); g.textAlign = 'center'; g.textBaseline = 'middle';

/* ---------- selection ---------- */
function selBox(){
  if (!SEL) return null;
  const fl = F();
  if (SEL.type === 'room'){ const r = (fl.rooms||[]).find(o=>o.id===SEL.id); return r && {x:r.x,y:r.y,w:r.w,d:r.d,rot:r.rot||0,o:r}; }
  if (SEL.type === 'item'){ const i = (fl.items||[]).find(o=>o.id===SEL.id); return i && {x:i.x,y:i.y,w:i.w,d:i.d,rot:i.rot||0,o:i}; }
  if (SEL.type === 'text'){ const x = (fl.texts||[]).find(o=>o.id===SEL.id); return x && {x:x.x,y:x.y,w:3,d:1,rot:x.rot||0,o:x}; }
  return null;
}
function handlePts(b){
  const hw = b.w/2, hd = b.d/2;
  const corner = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y]) => rot2(x,y,b.rot,b.x,b.y));
  const rotH = rot2(0, -hd - 22/cam.z, b.rot, b.x, b.y);

function drawSel(){

  g.beginPath(); g.moveTo(sx(corner[0][0]), sy(corner[0][1]));
  for (let i=1;i<4;i++) g.lineTo(sx(corner[i][0]), sy(corner[i][1]));
  g.closePath(); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.moveTo(sx(b.x), sy(b.y)); g.lineTo(sx(rotH[0]), sy(rotH[1]));
  g.lineWidth = 1; g.stroke();
  g.fillStyle = css('--accent');
  corner.forEach(([x,y]) => { g.beginPath(); g.rect(sx(x)-4, sy(y)-4, 8, 8); g.fill(); });
  g.beginPath(); g.arc(sx(rotH[0]), sy(rotH[1]), 5, 0, 7); g.fill();
  g.restore();
  if (SEL.type === 'room' || SEL.type === 'item'){
    dimLine(corner[0][0],corner[0][1],corner[1][0],corner[1][1],-26);

function drawOpenSel(){

  const s = segments(F()).find(x=>x.key===o.wall); if (!s) return;
  const L = segLen(s);
  const px = s.x1 + (s.x2-s.x1)*o.t, py = s.y1 + (s.y2-s.y1)*o.t;

}

/* ---------- ghost preview while drawing ---------- */
function drawGhost(){
  if (!ghost) return;
  g.save(); g.strokeStyle = css('--accent'); g.lineWidth = 1.6; g.setLineDash([6,4]);
  if (ghost.kind === 'rect'){
    const x = sx(Math.min(ghost.x1,ghost.x2)), y = sy(Math.min(ghost.y1,ghost.y2));
    const w = Math.abs(ghost.x2-ghost.x1)*cam.z, h = Math.abs(ghost.y2-ghost.y1)*cam.z;
    g.strokeRect(x,y,w,h); g.setLineDash([]);
    dimLine(ghost.x1,Math.min(ghost.y1,ghost.y2), ghost.x2,Math.min(ghost.y1,ghost.y2), -20, css('--accent'));
    dimLine(ghost.x2,ghost.y1, ghost.x2,ghost.y2, -20, css('--accent'));
  } else if (ghost.kind === 'line'){
    g.beginPath(); g.moveTo(sx(ghost.x1), sy(ghost.y1)); g.lineTo(sx(ghost.x2), sy(ghost.y2)); g.stroke();
    g.setLineDash([]);
    dimLine(ghost.x1,ghost.y1, ghost.x2,ghost.y2, -18, css('--accent'));

    const c = CATBY[ghost.k];

function drawMeasure(){
  if (!measureLine) return;

  [[m.x1,m.y1],[m.x2,m.y2]].forEach(([x,y]) => { g.beginPath(); g.arc(sx(x),sy(y),4,0,7); g.fillStyle = css('--meas'); g.fill(); });

/* ---------- main draw ---------- */
function draw(){
  if (!VW) resize2d();
  g.clearRect(0,0,VW,VH);
  g.fillStyle = css(EXPORTING ? '--canvas' : '--bg'); g.fillRect(0,0,VW,VH);
  if (!EXPORTING) drawGrid();
  drawPlot();

    const b = P.floors[P.active-1];
    drawFloor(b, true); drawItems(b, true);
  }
  const fl = F();

  drawItems(fl, false);
  drawTexts(fl);

}

/* ===================== 2D interaction ===================== */
const pts = new Map(); let pinch0 = null;
function evPos(e){ const r = c2.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }

function hitTest(px, py){
  const fl = F(), wxp = wx(px), wyp = wy(py), tol = 9/cam.z;
  /* handles of the current selection come first */
  const b = selBox();
  if (b){
    const { corner, rotH } = handlePts(b);
    if (d2(wxp,wyp,rotH[0],rotH[1]) < (10/cam.z)**2) return { type:'handle', h:'rot' };
    for (let i=0;i<4;i++) if (d2(wxp,wyp,corner[i][0],corner[i][1]) < (9/cam.z)**2) return { type:'handle', h:i };
  }
  for (let i=(fl.texts||[]).length-1;i>=0;i--){
    const x = fl.texts[i];

  for (let i=(fl.openings||[]).length-1;i>=0;i--){

  }

let world = null;

function box3(gp, x, y, z, w, h, d, mat){
  if (w < .002 || h < .002 || d < .002) return;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = mat !== M3.g; m.receiveShadow = true; gp.add(m);
}
function cyl3(gp, x, y, z, r, h, mat){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16), mat);
  m.position.set(x, y + h/2, z); m.castShadow = true; m.receiveShadow = true; gp.add(m);

/* a wall segment with its openings cut out */
function wallMesh(gp, s, base, H, ops){
  const L = segLen(s); if (L < .02) return;
  const ang = Math.atan2(s.y2-s.y1, s.x2-s.x1);
  const grp = new THREE.Group();
  grp.position.set((s.x1+s.x2)/2, base, (s.y1+s.y2)/2);
  grp.rotation.y = -ang;
  const put = (a,b,y0,y1) => {
    if (b-a < .002 || y1-y0 < .002) return;
    box3(grp, (a+b)/2 - L/2, (y0+y1)/2, 0, b-a, y1-y0, s.t, M3.wall);
  };
  const glass = (a,b,y0,y1) => {
    if (b-a < .002) return;
    box3(grp, (a+b)/2 - L/2, (y0+y1)/2, 0, b-a, y1-y0, s.t*0.22, M3.g);
    box3(grp, (a+b)/2 - L/2, y0, 0, b-a, .12, s.t*1.04, M3.d);
    box3(grp, (a+b)/2 - L/2, y1, 0, b-a, .12, s.t*1.04, M3.d);
  };
  const list = ops.slice().sort((p,q) => p.t - q.t);
  let cur = 0;
  list.forEach(o => {
    const a = clamp(o.t*L - o.w/2, 0, L), b = clamp(o.t*L + o.w/2, 0, L);
    put(cur, a, 0, H);
    const lo = o.type === 'door' ? 0 : (o.sill ?? 3), hi = Math.min(H, lo + o.h);
    if (lo > 0) put(a, b, 0, lo);
    if (hi < H) put(a, b, hi, H);
    if (o.type === 'window') glass(a, b, lo, hi);
    else {
      box3(grp, a - L/2 + .06, (0+hi)/2, 0, .12, hi, s.t*1.06, M3.door);
      box3(grp, b - L/2 - .06, (0+hi)/2, 0, .12, hi, s.t*1.06, M3.door);
      box3(grp, (a+b)/2 - L/2, hi, 0, b-a, .12, s.t*1.06, M3.door);
    }
    cur = b;
  });
  put(cur, L, 0, H);
  gp.add(grp);
}
function itemMesh(gp, it){
  const c = CATBY[it.k]; if (!c) return;
  const grp = new THREE.Group();
  grp.position.set(it.x, 0, it.y);
  grp.rotation.y = -(it.rot||0)*Math.PI/180;
  const W = it.w, D = it.d, H = it.h ?? c.h;
  (c.m||[]).forEach(b => {
    if (b[0] === 'b'){
      const [,cx,cz,bw,bd,y0,bh,mk] = b;
      box3(grp, cx*W, (y0 + bh/2)*H, cz*D, Math.max(.02,bw*W), Math.max(.02,bh*H), Math.max(.02,bd*D), M3[mk] || M3.l);
    } else if (b[0] === 'y'){
      const [,cx,cz,r,y0,bh,mk] = b;
      cyl3(grp, cx*W, y0*H, cz*D, r*Math.min(W,D), bh*H, M3[mk] || M3.l);
    } else if (b[0] === 's'){
      const [,cx,cz,r,y0,mk] = b;
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r*Math.min(W,D), 1), M3[mk] || M3.p);
      m.position.set(cx*W, y0*H, cz*D); m.castShadow = true; grp.add(m);
    }
  });
  gp.add(grp);
}

  if (R === 'north') box3(world, 0, -.1, -pd/2 - rw/2 - 4, Math.max(pw,pd)*4, .2, rw, M3.road);
  if (R === 'south') box3(world, 0, -.1,  pd/2 + rw/2 + 4, Math.max(pw,pd)*4, .2, rw, M3.road);
  if (R === 'west')  box3(world, -pw/2 - rw/2 - 4, -.1, 0, rw, .2, Math.max(pw,pd)*4, M3.road);
  if (R === 'east')  box3(world,  pw/2 + rw/2 + 4, -.1, 0, rw, .2, Math.max(pw,pd)*4, M3.road);
  /* floors */
  let base = 0;
  P.floors.forEach((fl, idx) => {
    const H = fl.h || 10;
    if (ONLY && idx !== P.active){ base += H + .8; return; }
    (fl.rooms||[]).forEach(r => {
      const grp = new THREE.Group();
      grp.position.set(r.x, 0, r.y); grp.rotation.y = -(r.rot||0)*Math.PI/180;
      box3(grp, 0, base + .08, 0, r.w, .32, r.d, idx ? M3.slab : M3.floor);
      box3(grp, 0, base + .25, 0, r.w - .5, .06, r.d - .5, M3.floor);
      world.add(grp);
    });
    segments(fl).forEach(s => {
      wallMesh(world, s, base + .3, H, (fl.openings||[]).filter(o => o.wall === s.key));
    });
    sortItems(fl.items||[]).forEach(it => {
      const g2 = new THREE.Group(); g2.position.y = base + .3; world.add(g2); itemMesh(g2, it);
    });
    base += H + .8;
  });
  dirty3 = false;
}
function walkStart(){
  const rs = (P.floors[P.active] || P.floors[0]).rooms || [];
  let cx = 0, far = P.plot.d/2 - 6;
  if (rs.length){
    const xs = rs.map(r => r.x);
    cx = (Math.min(...xs) + Math.max(...xs)) / 2;
    far = Math.max(...rs.map(r => r.y + r.d/2)) + 11;
  }
  let base = 0;
  for (let i = 0; i < P.active; i++) base += (P.floors[i].h || 10) + .8;
  WP.x = cx; WP.z = Math.min(far, P.plot.d/2 - 3); WP.y = base + 5.6;
  WP.yaw = 0; WP.pitch = -0.04;
}
function place3d(){
  const span = Math.max(P.plot.w, P.plot.d);
  const hh = P.floors.reduce((a,f)=>a+(f.h||10)+.8,0);
  orb.r = span * 1.25 + 24; orb.ty = hh*0.45; orb.tx = 0; orb.tz = 0; orb.th = 0.75; orb.ph = 1.05;
  WP.x = 0; WP.z = P.plot.d/2 + 12; WP.yaw = Math.PI; WP.y = 5.3;
}
function render3d(){
  if (!R3) return;
  const r = document.getElementById('c3d').getBoundingClientRect();
  if (!r.width) return;
  R3.setSize(r.width, r.height, false);
  C3.aspect = r.width / Math.max(1, r.height); C3.updateProjectionMatrix();
  if (dirty3) build3d();
  if (walk){
    C3.position.set(WP.x, WP.y, WP.z);
    C3.rotation.set(WP.pitch, WP.yaw, 0);
  } else {
    const sp = Math.sin(orb.ph);
    C3.position.set(orb.tx + orb.r*sp*Math.sin(orb.th), orb.ty + orb.r*Math.cos(orb.ph), orb.tz + orb.r*sp*Math.cos(orb.th));
    C3.lookAt(orb.tx, orb.ty, orb.tz);
  }
  R3.render(S3, C3);
}
let raf3 = null, last3 = performance.now();
function loop3(){
  raf3 = requestAnimationFrame(loop3);
  const now = performance.now(), dt = Math.min((now-last3)/1000, .05); last3 = now;
  if (document.body.dataset.view !== '3d'){ cancelAnimationFrame(raf3); raf3 = null; return; }
  if (walk) stepWalk(dt);
  render3d();
}
function stepWalk(dt){
  let mf = joy.y, mr = joy.x;
  if (keys3.has('w')||keys3.has('arrowup')) mf += 1;
  if (keys3.has('s')||keys3.has('arrowdown')) mf -= 1;
  if (keys3.has('a')) mr -= 1;
  if (keys3.has('d')) mr += 1;
  const L = Math.hypot(mf,mr); if (L > 1){ mf /= L; mr /= L; }
  const sp = 9*dt;
  const fx = -Math.sin(WP.yaw), fz = -Math.cos(WP.yaw);
  const rx =  Math.cos(WP.yaw), rz = -Math.sin(WP.yaw);
  WP.x += (fx*mf + rx*mr)*sp; WP.z += (fz*mf + rz*mr)*sp;
  /* stand on whichever floor slab is under us */
  let base = 0, stand = 0;
  P.floors.forEach(fl => {
    const on = (fl.rooms||[]).some(r => {
      const a = -(r.rot||0)*Math.PI/180, dx = WP.x-r.x, dy = WP.z-r.y;
      const lx = dx*Math.cos(a)-dy*Math.sin(a), ly = dx*Math.sin(a)+dy*Math.cos(a);
      return Math.abs(lx) <= r.w/2 && Math.abs(ly) <= r.d/2;
    });
    if (on && base + .3 <= WP.y - 2.2 + 6) stand = Math.max(stand, base + .3);
    base += (fl.h||10) + .8;
  });
  const targetY = stand + 5.3;
  WP.y += (targetY - WP.y) * Math.min(1, dt*8);
}
function bind3d(cv){
  const P3 = new Map(); let pz = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); P3.set(e.pointerId, pos(e));
    if (P3.size === 2){ const [a,b] = [...P3.values()]; pz = { d:Math.hypot(a.x-b.x,a.y-b.y), r:orb.r }; } });
  cv.addEventListener('pointermove', e => {
    if (!P3.has(e.pointerId)) return;
    const prev = P3.get(e.pointerId), p = pos(e);
    const dx = p.x-prev.x, dy = p.y-prev.y; P3.set(e.pointerId, p);
    if (P3.size === 2 && pz){ const [a,b] = [...P3.values()];
      orb.r = clamp(pz.r * pz.d / Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)), 6, 900); return; }
    if (walk){ WP.yaw -= dx*.005; WP.pitch = clamp(WP.pitch - dy*.004, -1.2, 1.1); }
    else { orb.th -= dx*.008; orb.ph = clamp(orb.ph - dy*.006, .12, 1.5); }
  });
  const up = e => { P3.delete(e.pointerId); if (P3.size < 2) pz = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); if (!walk) orb.r = clamp(orb.r * (1 + e.deltaY*.0013), 6, 900); }, { passive:false });
  window.addEventListener('keydown', e => { if (walk && ['w','a','s','d','arrowup','arrowdown'].includes(e.key.toLowerCase())){ keys3.add(e.key.toLowerCase()); e.preventDefault(); } });
  window.addEventListener('keyup', e => keys3.delete(e.key.toLowerCase()));
}

let catQ = '';
function thumb(c){
  const W = 100, H = 60, s = Math.min(W/c.w, H/c.d) * .82;
  const ww = c.w*s, dd = c.d*s;
  let p = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  p += `<g transform="translate(${W/2} ${H/2})" stroke="currentColor" stroke-width="1" fill="none">`;
  const fillOf = f => f===1?'rgba(128,128,128,.22)':f===2?'rgba(128,128,128,.42)':f===3?'var(--accent)':f===4?'rgba(128,160,150,.3)':'none';
  c.s.forEach(sh => {
    if (sh[0]==='r') p += `<rect x="${(sh[1]-sh[3]/2)*ww}" y="${(sh[2]-sh[4]/2)*dd}" width="${sh[3]*ww}" height="${sh[4]*dd}" fill="${fillOf(sh[5])}"/>`;
    else if (sh[0]==='c') p += `<circle cx="${sh[1]*ww}" cy="${sh[2]*dd}" r="${sh[3]*Math.min(ww,dd)}" fill="${fillOf(sh[4])}"/>`;
    else p += `<line x1="${sh[1]*ww}" y1="${sh[2]*dd}" x2="${sh[3]*ww}" y2="${sh[4]*dd}"/>`;
  });
  return p + '</g></svg>';
}

function exportPng(){
  const w = P.plot.w + 24, d = P.plot.d + 24;
  const z = Math.min(2000/w, 2600/d, 55);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w*z); cv.height = Math.round(d*z);
  const gg = cv.getContext('2d');
  const old = { g, VW, VH, DPR, x:cam.x, y:cam.y, z:cam.z, sel:SEL, ghost, measure:measureLine };
  SEL = null; ghost = null; measureLine = null; EXPORTING = true;
  g = gg; VW = cv.width; VH = cv.height; DPR = 1;
  cam.x = 0; cam.y = 0; cam.z = z;
  gg.setTransform(1,0,0,1,0,0);
  draw();
  /* title block */
  gg.font = '600 ' + Math.round(z*1.1) + 'px ' + css('--fontUI');
  gg.fillStyle = css('--ink'); gg.textAlign = 'left'; gg.textBaseline = 'top';
  gg.fillText((P.name || 'Plan') + ' — ' + floorLabel(F()), 18, 14);

            + '   ·   ' + landBreakdown(plotArea()), 18, 16 + z*1.35);

  EXPORTING = false;

  cam.x = old.x; cam.y = old.y; cam.z = old.z; SEL = old.sel; ghost = old.ghost; measureLine = old.measure;
  g.setTransform(DPR,0,0,DPR,0,0); draw();

/* Saving a file: inside the Claude viewer this goes through the downloads
   capability; in the standalone build a plain link works. Either way the
   button only appears once we know a save is possible. */
function wireSave(btn, fname, cv, url){
  if (!btn) return;
  const msg = document.getElementById('m_saveMsg');
  const plainLink = () => {
    const a = document.createElement('a');
    if (typeof a.download !== 'string') return false;
    btn.hidden = false;
    btn.onclick = () => { a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); };
    return true;
  };
  if (typeof window.claude === 'undefined' || !window.claude.use){ plainLink(); return; }
  window.claude.use('downloads').then(dl => {
    if (!dl){ plainLink(); return; }
    btn.hidden = false;
    btn.onclick = () => {
      btn.disabled = true;
      cv.toBlob(blob => {
        dl.save({ filename:fname, data:blob })
          .then(() => { btn.disabled = false; msg.textContent = t('saved'); })
          .catch(err => {
            btn.disabled = false;
            msg.textContent = (err && err.code === 'declined') ? '' : t('pngNote');
          });
      }, 'image/png');
    };
  }).catch(() => plainLink());
}

function svArea(s){
  const sides = s.sides.map(m => m.len);
  let diags = s.diags.map(m => m.len);
  if (sides.some(v => !(v > 0))) return 0;
  if (s.n === 4 && !(diags[0] > 0)) return 0;
  const poly = solvePolygon(sides, diags);
  return poly ? polyArea(poly) : 0;
}
function svgShape(s){
  const sides = s.sides.map(m => m.len), diags = s.diags.map(m => m.len);
  let poly = null;
  if (!sides.some(v => !(v > 0)) && !(s.n === 4 && !(diags[0] > 0))) poly = solvePolygon(sides, diags);
  if (!poly){                                            /* idealised preview */
    poly = []; for (let i = 0; i < s.n; i++){
      const a = -Math.PI/2 + i*2*Math.PI/s.n;
      poly.push([Math.cos(a)*10, Math.sin(a)*10]);
    }
  }
  const b = polyBounds(poly), W = 240, H = 150, pad = 24;
  const k = Math.min((W-pad*2)/Math.max(.01,b.x2-b.x1), (H-pad*2)/Math.max(.01,b.y2-b.y1));
  const px = x => W/2 + (x - (b.x1+b.x2)/2)*k, py = y => H/2 + (y - (b.y1+b.y2)/2)*k;
  const pathD = poly.map((p,i) => (i?'L':'M') + px(p[0]).toFixed(1) + ' ' + py(p[1]).toFixed(1)).join(' ') + ' Z';
  let out = `<svg class="svshape" viewBox="0 0 ${W} ${H}" role="img" aria-label="plot shape">
    <path d="${pathD}" fill="rgba(110,170,80,.14)" stroke="var(--land)" stroke-width="1.6"/>`;
  poly.forEach((p,i) => {
    const q = poly[(i+1) % poly.length];
    const mx = (px(p[0])+px(q[0]))/2, my = (py(p[1])+py(q[1]))/2;
    out += `<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="3.4" fill="var(--land)"/>`;
    out += `<text x="${px(p[0]).toFixed(1)}" y="${(py(p[1])-7).toFixed(1)}" font-size="10" font-weight="700"
             fill="var(--ink2)" text-anchor="middle">${CORNER(i)}</text>`;
    out += `<text class="svside" data-i="${i}" x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-size="9.5"
             fill="var(--accent)" text-anchor="middle" style="cursor:pointer">${
               s.sides[i] && s.sides[i].len > 0 ? fmtLen(s.sides[i].len) : '?'}</text>`;
  });
  return out + '</svg>';
}

function arSupported(){

}
function arMeasure(){
  const msg = document.getElementById('cam_msg');
  const say = txt => { if (msg) msg.textContent = txt; };
  if (!navigator.xr){ say(t('arNo')); return; }
  say(t('arStarting'));

      <div id="arBtns">

        <button id="ar_mark" class="arb big">${esc(t('arMark'))}</button>

  document.body.appendChild(ov);

  const feats = { requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay','light-estimation'], domOverlay:{ root: ov } };
  navigator.xr.requestSession('immersive-ar', feats)
    .catch(() => navigator.xr.requestSession('immersive-ar', { requiredFeatures:['hit-test'] }))
    .then(s => runAR(s, cvs, ov, say))
    .catch(() => { ov.remove(); cvs.remove(); say(t('arNo')); });
}

function runAR(session, cvs, ov, say){
  const $ = id => document.getElementById(id);
  const renderer = new THREE.WebGLRenderer({ canvas:cvs, alpha:true, antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.autoClear = true;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 60);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.1));

  /* reticle: the ring that sits on the ground where the tablet is aiming */
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.055, 0.075, 40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xff7a18, side:THREE.DoubleSide })
  );
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(0.012, 24).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0xffffff })
  );
  ring.add(dot);
  ring.matrixAutoUpdate = false; ring.visible = false;
  scene.add(ring);

  const group = new THREE.Group(); scene.add(group);
  const pegGeo = new THREE.SphereGeometry(0.035, 16, 12);
  const pegMat = new THREE.MeshBasicMaterial({ color:0xff7a18 });
  const lineMat = new THREE.LineBasicMaterial({ color:0xffffff });
  let liveLine = null;

  const pts = [];                 /* THREE.Vector3, metres, local space */
  let hitSrc = null, ref = null, reticlePos = null, ended = false;

  const dist = (a,b) => a.distanceTo(b);
  const total = () => { let d = 0; for (let i=1;i<pts.length;i++) d += dist(pts[i-1], pts[i]); return d; };
  const show = () => {
    const m = total();
    let live = m;
    if (pts.length >= 1 && reticlePos && pts.length < 2) live = m + dist(pts[pts.length-1], reticlePos);
    else if (pts.length >= 1 && reticlePos) live = m + dist(pts[pts.length-1], reticlePos);
    const ft = (pts.length ? live : 0) * FT_PER_M;
    const fixed = m * FT_PER_M;
    $('arBig').textContent = fmtLen(ft);
    $('arSub').textContent = t('arTotal') + ' ' + fmtLen(fixed) + ' · ' + pts.length + ' ' + t('arPoints');
    $('arTip').textContent = pts.length === 0 ? t('arHint') : t('arWalk');
  };

  const rebuild = () => {
    while (group.children.length) group.remove(group.children[0]);
    pts.forEach(p => { const m = new THREE.Mesh(pegGeo, pegMat); m.position.copy(p); group.add(m); });
    if (pts.length >= 2){
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      group.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color:0xff7a18 })));
    }
    show();
  };

  const addPoint = () => {
    if (!reticlePos) return;
    pts.push(reticlePos.clone());
    rebuild();
  };

  $('ar_mark').onclick = addPoint;
  $('ar_undo').onclick = () => { pts.pop(); rebuild(); };
  $('ar_exit').onclick = () => { session.end(); };
  $('ar_done').onclick = () => {
    if (pts.length < 2){ $('arTip').textContent = t('arNeed2'); return; }
    const ft = total() * FT_PER_M;
    session.end();
    const box = document.getElementById('cam_len');
    if (box){ box.value = fmt(ft); }
    say(t('arGot') + ' ' + fmtLen(ft));
  };
  session.addEventListener('select', addPoint);

  const resize = () => {
    cam.aspect = window.innerWidth/window.innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  };
  resize(); window.addEventListener('resize', resize);

  renderer.xr.setSession(session).then(async () => {
    ref = renderer.xr.getReferenceSpace();
    const viewer = await session.requestReferenceSpace('viewer');
    hitSrc = await session.requestHitTestSource({ space: viewer });
    show();
  });

  renderer.setAnimationLoop((time, frame) => {
    if (!frame || !hitSrc) { renderer.render(scene, cam); return; }
    const space = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitSrc);
    if (hits.length){
      const pose = hits[0].getPose(space);
      if (pose){
        ring.visible = true;
        ring.matrix.fromArray(pose.transform.matrix);
        reticlePos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
        if (pts.length){
          if (liveLine) group.remove(liveLine);
          const g = new THREE.BufferGeometry().setFromPoints([pts[pts.length-1], reticlePos]);
          liveLine = new THREE.Line(g, lineMat); group.add(liveLine);
        }
        show();
      }
    } else {
      ring.visible = false;
      if ($('arTip') && pts.length === 0) $('arTip').textContent = t('arLook');
    }
    renderer.render(scene, cam);
  });

  session.addEventListener('end', () => {
    if (ended) return; ended = true;
    renderer.setAnimationLoop(null);
    window.removeEventListener('resize', resize);
    try { renderer.dispose(); } catch(e){}
    cvs.remove(); ov.remove();
    if (!modal.hidden && !(camState && camState.frozen)) startCamera();
  });
}

    joy.x = dx/max; joy.y = -dy/max;
  };
  j.addEventListener('pointerdown', e => { jid = e.pointerId; j.setPointerCapture(e.pointerId); move(e); e.stopPropagation(); });
  j.addEventListener('pointermove', e => { if (e.pointerId === jid) move(e); });
  const end = e => { if (e.pointerId === jid){ jid = null; joy.x = joy.y = 0;
    document.getElementById('joyKnob').style.transform = ''; } };
  j.addEventListener('pointerup', end); j.addEventListener('pointercancel', end);

  it(G0,'sofa3', -12.4, 7,    90);  it(G0,'sofa2',  -4,   2.6,  0);
  it(G0,'tv_unit', 4.3, 7,   270);  it(G0,'coffee', -4,   7,    0);
  it(G0,'plant', -12.8, 11.6,  0);  it(G0,'shelf',  -12.6,2.4,  0);
  it(G0,'dine6',  1,   -3.75,  0);  it(G0,'counter',-9,   -7.5, 0);

  it(G0,'side_tbl',-4.6,-14.6, 0);  it(G0,'rug',     0,  -18,   0);
  it(G0,'toilet',12.4,-23,   270);  it(G0,'basin',  12.4,-19.6,270);

  /* --- first floor --- */

/* ---------- boot ---------- */
function init(){
  try { const u = localStorage.getItem('nlbuilder.unit'); if (u) UNIT = u; } catch(e){}
  try { const l = localStorage.getItem('nlbuilder.lang'); if (l) LANG = +l; } catch(e){}
  try { const th = localStorage.getItem('nlbuilder.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
  if (!load()) loadSample();
  if (!P.plot.hasOwnProperty('poly')) P.plot.poly = null;
  ensureSurvey();
  buildRail(); buildWalkUI();
  document.querySelectorAll('#sideTabs button').forEach(b => b.onclick = () => openTab(b.dataset.tab));
  document.getElementById('v2d').onclick = () => setView('2d');
  document.getElementById('v3d').onclick = () => setView('3d');
  document.getElementById('uft').onclick = () => { UNIT = 'ft'; applyUnit(); };
  document.getElementById('um').onclick  = () => { UNIT = 'm';  applyUnit(); };
  document.getElementById('len').onclick = () => { LANG = 0; try{localStorage.setItem('nlbuilder.lang','0');}catch(e){} applyI18n(); };
  document.getElementById('lbn').onclick = () => { LANG = 1; try{localStorage.setItem('nlbuilder.lang','1');}catch(e){} applyI18n(); };
  document.getElementById('btnHelp').onclick = showHelp;
  document.getElementById('sideToggle').onclick = () =>
    document.body.dataset.side = document.body.dataset.side === 'open' ? '' : 'open';
  document.getElementById('btnTheme').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('nlbuilder.theme', next); } catch(e){}
    draw();
  };
  const ro = new ResizeObserver(() => { resize2d(); draw(); });
  ro.observe(document.getElementById('stage'));
  window.addEventListener('resize', () => { resize2d(); draw(); });
  resize2d(); applyUnit(); applyI18n(); setTool('select'); fitView();
  let v = '2d'; try { v = localStorage.getItem('nlbuilder.view') || '2d'; } catch(e){}
  setView(v);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
